apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps
  prune: true
  # No wait: this path contains ExternalSecret resources, which Flux's wait
  # health check can't track (status poller reports them 'NotFound' even when
  # Ready, timing the check out). Re-introducing deploy gating for these apps is
  # tracked separately (candidate: migrate Kustomize apps to HelmReleases).
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
