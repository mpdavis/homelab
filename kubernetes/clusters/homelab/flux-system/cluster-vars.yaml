apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
data:
  NAS_IP: "10.0.1.6"
  NAS_DATA_PATH: "/var/nfs/shared/data"
  NAS_HOMELAB_PATH: "/var/nfs/shared/homelab"
  TZ: "America/Chicago"
  # Public-facing identity
  DOMAIN: "mpdavis.com"
  EMAIL: "michael@mpdavis.com"
  GIT_REPO_URL: "https://github.com/mpdavis/homelab"
  # Networking
  METALLB_POOL: "10.0.1.200-10.0.1.250"
  PUBLIC_IP: "46.110.78.19"
  # Traefik VIPs. PUBLIC is the router's 443 port-forward target; TAILNET is
  # never forwarded (LAN + Tailscale subnet route only). Both inside METALLB_POOL.
  TRAEFIK_PUBLIC_IP: "10.0.1.200"
  TRAEFIK_TAILNET_IP: "10.0.1.210"
  # Caddy on the compose host (docker, pve2). Services migrated off k3s answer
  # here instead of on a Traefik VIP; Gatus still probes them by hostname.
  COMPOSE_TAILNET_IP: "10.0.1.57"
  # Caddy on the infra host (infra, pve1), which serves what never ran in the
  # cluster — LAN hosts Traefik used to front via Service+Endpoints.
  INFRA_TAILNET_IP: "10.0.1.58"
  # Public Caddy on the compose host: the router's 443 forward target, and so
  # the entry point every public hostname actually answers on.
  COMPOSE_PUBLIC_IP: "10.0.1.56"
  # Authentik's embedded outpost, reachable from the compose hosts so their
  # Caddy can forward-auth against it. Retires when authentik itself moves.
  AUTHENTIK_LAN_IP: "10.0.1.211"
  # Emby, reachable from the compose host for the iptv apps that call it.
  # Retires when emby moves.
  EMBY_LAN_IP: "10.0.1.212"
  # The compose host's own address, where the few services k3s still calls
  # publish their port.
  COMPOSE_HOST_IP: "10.0.1.55"
