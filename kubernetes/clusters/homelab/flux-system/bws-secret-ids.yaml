# Central registry of Bitwarden Secrets Manager (BWS) secret IDs.
#
# These UUIDs identify individual secrets in BWS. They are not sensitive — the
# actual secret values are fetched at runtime by External Secrets Operator using
# the access token in the bitwarden ClusterSecretStore.
#
# Each UUID is defined once here and referenced from ExternalSecret manifests as
# a ${BWS_*} placeholder, resolved by Flux postBuild substitution. Any
# Kustomization containing an ExternalSecret must list this ConfigMap in its
# spec.postBuild.substituteFrom.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bws-secret-ids
  namespace: flux-system
data:
  # Cloudflare API token — used by external-dns and cert-manager (DNS-01)
  BWS_CLOUDFLARE_API_TOKEN: "67c9d80b-ca8e-47b5-a2eb-b442005fab6a"

  # GitHub token — Flux notifications commit-status provider
  BWS_GITHUB_TOKEN: "6a623ba5-dc2b-4eea-b989-b46500f1c995"

  # Authelia
  BWS_AUTHELIA_JWT_SECRET: "e2f00c0f-09cf-4cce-a955-b4600104fe8a"
  BWS_AUTHELIA_SESSION_SECRET: "855976cf-4f8b-42f0-b6bf-b46001053108"
  BWS_AUTHELIA_STORAGE_ENCRYPTION_KEY: "428f90ae-7a5f-4450-a0e2-b460010545d7"
  BWS_AUTHELIA_PASSWORD_HASH: "4544a484-7e6e-4543-9e0b-b4600109167d"

  # Grafana admin credentials
  BWS_GRAFANA_ADMIN_USER: "5d21d6d4-5452-4a20-88fc-b4510146bcc9"
  BWS_GRAFANA_ADMIN_PASSWORD: "84b2fe83-0a83-4b84-8f5d-b3e001210112"

  # ProtonVPN WireGuard private key — qbittorrent gluetun sidecar (generate the
  # key in the ProtonVPN dashboard with NAT-PMP/port forwarding enabled)
  BWS_PROTONVPN_WIREGUARD_PRIVATE_KEY: "0c89eb67-af7c-40ad-b6b3-b489011b27eb"

  # Mousehole web UI auth password — qbittorrent pod (tracker IP updater)
  BWS_MOUSEHOLE_AUTH_PASSWORD: "4f6ae5ae-e5b8-48c1-859d-b473013e79f0"

  # Coding agent (CloudCLI) — Claude subscription OAuth token from
  # `claude setup-token` (~1yr expiry) + fine-grained GitHub PAT scoped to
  # mpdavis/homelab (Contents RW, Pull requests RW)
  BWS_CODING_AGENT_CLAUDE_OAUTH_TOKEN: "ef3d9f41-d319-4908-b19b-b48d0117139c"
  BWS_CODING_AGENT_GITHUB_TOKEN: "89ab1462-9884-4299-a75d-b48d0118e126"

  # Recyclarr — *arr API keys
  BWS_SONARR_API_KEY: "d84fd750-7fc2-45bf-8c91-b3e001210193"
  BWS_RADARR_API_KEY: "9f883764-3296-4f58-9f0f-b3e001213e2a"

  # Paperless-ngx
  BWS_PAPERLESS_SECRET_KEY: "bef9df2f-0c8b-45aa-a32f-b475004130b0"
  BWS_PAPERLESS_ADMIN_USER: "51e09547-70ad-40d6-a213-b475004130e5"
  BWS_PAPERLESS_ADMIN_PASSWORD: "333d3068-fdfa-4cfc-af8a-b47500413115"
  # Paperless ↔ Authentik OIDC client secret (shared: authentik provider
  # blueprint + paperless allauth config)
  BWS_PAPERLESS_OIDC_CLIENT_SECRET: "84cbee0e-fe48-4b8e-93dc-b475004d59c7"

  # Authentik — SSO/identity provider (secret key, bundled postgres password,
  # akadmin bootstrap password + API token)
  BWS_AUTHENTIK_SECRET_KEY: "e04c3e06-b4a8-47f5-bd59-b4750043398d"
  BWS_AUTHENTIK_POSTGRES_PASSWORD: "9cf4d002-7467-4b35-83d0-b475004339c3"
  BWS_AUTHENTIK_BOOTSTRAP_PASSWORD: "2441a661-fe19-41c6-bb72-b475004339f3"
  BWS_AUTHENTIK_BOOTSTRAP_TOKEN: "099a7283-dfd6-41ce-8241-b47500433a21"

  # Trek — self-hosted travel planner (at-rest encryption key for stored
  # secrets/documents)
  BWS_TREK_ENCRYPTION_KEY: "5fa795ca-e832-4dcc-8f8b-b48d0123023b"

  # ntfy — access token (user "alertmanager", read-write on topic
  # homelab-alerts) used by Alertmanager to publish notifications
  BWS_NTFY_ALERTMANAGER_TOKEN: "47079c89-adab-4d19-8173-b48d01492747"
