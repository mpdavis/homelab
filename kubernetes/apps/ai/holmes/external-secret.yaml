apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: holmes-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: holmes-secrets
  data:
    # Claude subscription OAuth token from `claude setup-token` — the SAME BWS
    # secret the coding agent uses. The Meridian sidecar authenticates with it
    # and exposes an Anthropic-compatible API on loopback, so this job spends
    # the subscription rather than a metered API key. Rotating the BWS value
    # re-points both consumers.
    - secretKey: claude-code-oauth-token
      remoteRef:
        key: ${BWS_CODING_AGENT_CLAUDE_OAUTH_TOKEN}
    # Discord webhook URL for the forum channel that holds deploy threads.
    # Anyone with this URL can post to that channel, so it lives in BWS like
    # any other credential and is never rendered into a manifest.
    - secretKey: discord-webhook-url
      remoteRef:
        key: ${BWS_HOLMES_DISCORD_WEBHOOK_URL}
