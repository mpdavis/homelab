apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: coding-agent
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`code.${DOMAIN}`)
      kind: Rule
      middlewares:
        - name: authelia
          namespace: authelia
      services:
        - name: coding-agent
          port: 3001
  tls: {}
