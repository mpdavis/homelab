apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coding-agent
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "~5.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    crds: CreateReplace
  values:
    defaultPodOptions:
      # cloudcli reads HOST/SERVER_PORT-style env; keep the namespace's
      # service-link vars out of the pod (see CLAUDE.md gotcha).
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    serviceAccount:
      coding-agent:
        # Fixed name so the ClusterRoleBindings in rbac.yaml can reference it.
        forceRename: coding-agent
    controllers:
      main:
        strategy: Recreate
        serviceAccount:
          identifier: coding-agent
        containers:
          main:
            image:
              repository: ghcr.io/mpdavis/coding-agent
              # build-coding-agent.yml publishes only from main, so every tag in
              # the registry is merged code and renovate's bump can be taken as
              # read. Tags below 1.0.48 predate that and may be branch builds.
              tag: 1.0.132
            env:
              TZ: ${TZ}
              GIT_REPO_URL: ${GIT_REPO_URL}
              SERVER_PORT: "3001"
              HOST: "0.0.0.0"
              # The claude CLI must not try to update itself inside the image
              DISABLE_AUTOUPDATER: "1"
              CLAUDE_CODE_OAUTH_TOKEN:
                secretKeyRef:
                  name: coding-agent-secrets
                  key: claude-code-oauth-token
              GH_TOKEN:
                secretKeyRef:
                  name: coding-agent-secrets
                  key: github-token
              GITHUB_TOKEN:
                secretKeyRef:
                  name: coding-agent-secrets
                  key: github-token
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 4Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 3001
    persistence:
      home:
        existingClaim: coding-agent
        advancedMounts:
          main:
            main:
              - path: /home/agent
