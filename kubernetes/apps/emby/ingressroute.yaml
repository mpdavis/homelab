apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: emby
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`emby.mpdavis.com`)
      kind: Rule
      middlewares:
        - name: authelia
          namespace: authelia
      services:
        - name: emby
          port: 8096
  tls: {}
