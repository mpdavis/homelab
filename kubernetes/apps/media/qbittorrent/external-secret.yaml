apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: protonvpn-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: protonvpn-credentials
  data:
    - secretKey: wireguard-private-key
      remoteRef:
        key: ${BWS_PROTONVPN_WIREGUARD_PRIVATE_KEY}
