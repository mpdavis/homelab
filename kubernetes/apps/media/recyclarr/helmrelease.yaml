apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "~5.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    crds: CreateReplace
  values:
    defaultPodOptions:
      # The recyclarr image already runs as uid 1000 by default; pin it explicitly.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      main:
        type: cronjob
        cronjob:
          schedule: "0 */6 * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
        containers:
          main:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 8.7.1
            command:
              - recyclarr
              - sync
            env:
              TZ: ${TZ}
              SONARR_API_KEY:
                secretKeyRef:
                  name: recyclarr-secrets
                  key: sonarr-api-key
              RADARR_API_KEY:
                secretKeyRef:
                  name: recyclarr-secrets
                  key: radarr-api-key
    persistence:
      config:
        existingClaim: recyclarr
        globalMounts:
          - path: /config
      config-file:
        type: configMap
        name: recyclarr-config
        advancedMounts:
          main:
            main:
              - path: /config/recyclarr.yml
                subPath: recyclarr.yml
