apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: streamflow
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`streamflow.${DOMAIN}`)
      kind: Rule
      middlewares:
        - name: authelia
          namespace: authelia
      services:
        - name: streamflow
          port: 5000
  tls: {}
