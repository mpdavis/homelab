apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcharr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dispatcharr
  template:
    metadata:
      labels:
        app: dispatcharr
    spec:
      runtimeClassName: nvidia
      containers:
        - name: dispatcharr
          image: ghcr.io/dispatcharr/dispatcharr:latest@sha256:af736a2337830e6a726120a3585d37122be0bca29d5244b7de412c9c34be826a
          ports:
            - containerPort: 9191
              name: http
          env:
            - name: DISPATCHARR_ENV
              value: aio
            - name: TZ
              value: ${TZ}
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: all
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dispatcharr-data
