apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dispatcharr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dispatcharr.mpdavis.com`)
      kind: Rule
      middlewares:
        - name: authelia
          namespace: authelia
      services:
        - name: dispatcharr
          port: 9191
  tls: {}
