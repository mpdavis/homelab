apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ecm
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ecm.${DOMAIN}`) && PathPrefix(`/mcp`)
      kind: Rule
      services:
        - name: ecm
          port: 6101
    - match: Host(`ecm.${DOMAIN}`)
      kind: Rule
      services:
        - name: ecm
          port: 6100
  tls: {}
