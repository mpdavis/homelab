apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ecm
  template:
    metadata:
      labels:
        app: ecm
    spec:
      containers:
        - name: ecm
          image: ghcr.io/motwakorb/enhancedchannelmanager:latest@sha256:c6914d58b8971335f847dfe874f7731595c3d0e278e0a1923e6e943ce744593a
          ports:
            - containerPort: 6100
              name: http
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: CONFIG_DIR
              value: /config
            - name: ECM_PORT
              value: "6100"
            - name: TZ
              value: ${TZ}
            - name: MCP_HOST
              value: localhost
          volumeMounts:
            - name: config
              mountPath: /config
        - name: ecm-mcp
          image: ghcr.io/motwakorb/enhancedchannelmanager-mcp:latest@sha256:4312802781d7e82b6d860520d16f2af99a2bd6b78a07880bcc26cb4569ab7b07
          ports:
            - containerPort: 6101
              name: mcp
          env:
            - name: ECM_URL
              value: http://localhost:6100
            - name: MCP_PORT
              value: "6101"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: ecm-config
