apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ecm
  template:
    metadata:
      labels:
        app: ecm
    spec:
      containers:
        - name: ecm
          image: ghcr.io/motwakorb/enhancedchannelmanager:latest@sha256:003c42fbd8d3cfa22d3ef9a18b9044f8b46652d8a4f7fdae647288c023246706
          ports:
            - containerPort: 6100
              name: http
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: CONFIG_DIR
              value: /config
            - name: ECM_PORT
              value: "6100"
            - name: TZ
              value: ${TZ}
            - name: MCP_HOST
              value: localhost
          volumeMounts:
            - name: config
              mountPath: /config
        - name: ecm-mcp
          image: ghcr.io/motwakorb/enhancedchannelmanager-mcp:latest@sha256:8c9b600eec251496c3063824d5f66ac2f6034b66e3d1812c38f51e60de1edf14
          ports:
            - containerPort: 6101
              name: mcp
          env:
            - name: ECM_URL
              value: http://localhost:6100
            - name: MCP_PORT
              value: "6101"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: ecm-config
