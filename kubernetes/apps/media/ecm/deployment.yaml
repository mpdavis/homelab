apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ecm
  template:
    metadata:
      labels:
        app: ecm
    spec:
      containers:
        - name: ecm
          image: ghcr.io/motwakorb/enhancedchannelmanager:latest@sha256:2ef4645a618283264f2966b1db2ae387c9629ed254831fea4365bfec604fa0fb
          ports:
            - containerPort: 6100
              name: http
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: CONFIG_DIR
              value: /config
            - name: ECM_PORT
              value: "6100"
            - name: TZ
              value: ${TZ}
            - name: MCP_HOST
              value: localhost
          volumeMounts:
            - name: config
              mountPath: /config
        - name: ecm-mcp
          image: ghcr.io/motwakorb/enhancedchannelmanager-mcp:latest@sha256:fb1349c9678c89cd15a80d7361aadf1c24f3f4b94e08e215479bd24186c761d9
          ports:
            - containerPort: 6101
              name: mcp
          env:
            - name: ECM_URL
              value: http://localhost:6100
            - name: MCP_PORT
              value: "6101"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: ecm-config
