apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ecm
  template:
    metadata:
      labels:
        app: ecm
    spec:
      # ECM's entrypoint starts as root, applies PUID/PGID via usermod/groupmod,
      # then drops privileges itself (`exec gosu appuser ...`). gosu is not
      # setuid, so pinning runAsUser/runAsGroup here makes it fail with
      # "failed switching to appuser: operation not permitted" -- both in the
      # /config write probe (reported as the misleading "Config directory is not
      # writable") and in the final exec. Only fsGroup is safe to set.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: ecm
          image: ghcr.io/motwakorb/enhancedchannelmanager:latest@sha256:2ef4645a618283264f2966b1db2ae387c9629ed254831fea4365bfec604fa0fb
          ports:
            - containerPort: 6100
              name: http
          env:
            # Honoured by the entrypoint (PUID=${PUID:-1000} + usermod/groupmod);
            # this image is not a no-op LinuxServer-style consumer of them.
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: CONFIG_DIR
              value: /config
            - name: ECM_PORT
              value: "6100"
            - name: TZ
              value: ${TZ}
            - name: MCP_HOST
              value: localhost
          volumeMounts:
            - name: config
              mountPath: /config
        - name: ecm-mcp
          image: ghcr.io/motwakorb/enhancedchannelmanager-mcp:latest@sha256:4312802781d7e82b6d860520d16f2af99a2bd6b78a07880bcc26cb4569ab7b07
          ports:
            - containerPort: 6101
              name: mcp
          env:
            - name: ECM_URL
              value: http://localhost:6100
            - name: MCP_PORT
              value: "6101"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: ecm-config
