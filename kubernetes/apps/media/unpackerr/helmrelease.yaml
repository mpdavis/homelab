apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpackerr
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "~5.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    crds: CreateReplace
  values:
    defaultPodOptions:
      # Run as the same uid/gid that owns the media share (matches qbittorrent's
      # PUID/PGID) so extracted files land with correct ownership. The upstream
      # image runs as root by default.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/unpackerr/unpackerr
              tag: v0.16.1
            # Container-level hardening; the pod-level securityContext above
            # pins uid/gid. readOnlyRootFilesystem needs the tmp emptyDir below.
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            env:
              TZ: ${TZ}
              # Log to stdout so output is visible via `kubectl logs`.
              UN_LOG_FILE: ""
              UN_INTERVAL: 2m
              # Sonarr — reuses the existing recyclarr API-key secret.
              UN_SONARR_0_URL: http://sonarr:8989
              UN_SONARR_0_API_KEY:
                secretKeyRef:
                  name: unpackerr-secrets
                  key: sonarr-api-key
              # Where qbittorrent drops completed downloads the *arr apps import,
              # not the whole library — avoids watching the entire media tree.
              UN_SONARR_0_PATHS_0: /media/downloads
              # Radarr — reuses the existing recyclarr API-key secret.
              UN_RADARR_0_URL: http://radarr:7878
              UN_RADARR_0_API_KEY:
                secretKeyRef:
                  name: unpackerr-secrets
                  key: radarr-api-key
              UN_RADARR_0_PATHS_0: /media/downloads
    persistence:
      config:
        existingClaim: unpackerr
        globalMounts:
          - path: /config
      # Writable scratch for unpackerr's extraction temp files, required because
      # the root filesystem is mounted read-only.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # The download/media share the *arr apps and qbittorrent use. unpackerr
      # must see the completed-download paths at the same location the *arr apps
      # report, so it mounts the same NFS share at /media.
      media:
        type: nfs
        server: ${NAS_IP}
        path: ${NAS_DATA_PATH}/media
        globalMounts:
          - path: /media
