apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpackerr
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "~5.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    crds: CreateReplace
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/unpackerr/unpackerr
              tag: 0.14.5
            env:
              TZ: ${TZ}
              # Run as the same UID/GID as the arr stack so extracted files are owned correctly
              UN_UID: "1000"
              UN_GID: "1000"
              # Sonarr
              UN_SONARR_0_URL: http://sonarr:8989
              UN_SONARR_0_PATHS_0: /media
              UN_SONARR_0_API_KEY:
                secretKeyRef:
                  name: unpackerr-secrets
                  key: sonarr-api-key
              # Radarr
              UN_RADARR_0_URL: http://radarr:7878
              UN_RADARR_0_PATHS_0: /media
              UN_RADARR_0_API_KEY:
                secretKeyRef:
                  name: unpackerr-secrets
                  key: radarr-api-key
    persistence:
      media:
        type: nfs
        server: ${NAS_IP}
        path: ${NAS_DATA_PATH}/media
        globalMounts:
          - path: /media
