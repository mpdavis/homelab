apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
spec:
  interval: 30m
  chart:
    spec:
      chart: seerr-chart
      version: "~3.6"
      sourceRef:
        kind: HelmRepository
        name: seerr
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    crds: CreateReplace
  values:
    fullnameOverride: seerr
    persistence:
      storageClass: local-path
      size: 2Gi
    extraEnv:
      - name: TZ
        value: ${TZ}
