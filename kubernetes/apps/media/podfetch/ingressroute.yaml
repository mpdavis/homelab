apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: podfetch
  labels:
    homelab.mpdavis.com/exposure: tailnet
spec:
  entryPoints:
    - tailnet
  routes:
    - match: Host(`podfetch.${DOMAIN}`)
      kind: Rule
      services:
        - name: podfetch
          port: 8000
  tls: {}
