apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lazylibrarian
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "~5.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    crds: CreateReplace
  values:
    controllers:
      main:
        containers:
          main:
            image:
              # LinuxServer.io image. Tags are commit-based (no semver); pin to a
              # specific build — never latest. Bump as new builds are released.
              repository: lscr.io/linuxserver/lazylibrarian
              tag: version-9f27dc9d
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: ${TZ}
    service:
      main:
        controller: main
        ports:
          http:
            port: 5299
    persistence:
      config:
        existingClaim: lazylibrarian
        globalMounts:
          - path: /config
      # The shared media NFS export. Configure LazyLibrarian's eBook/AudioBook
      # destination to /media/books and its download dir to /media/downloads in
      # the web UI (matches where qbittorrent/the *arr apps read & write).
      media:
        type: nfs
        server: ${NAS_IP}
        path: ${NAS_DATA_PATH}/media
        globalMounts:
          - path: /media
