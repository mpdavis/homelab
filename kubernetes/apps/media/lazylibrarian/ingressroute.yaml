apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lazylibrarian
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`lazylibrarian.mpdavis.com`)
      kind: Rule
      middlewares:
        - name: authelia
          namespace: authelia
      services:
        - name: lazylibrarian
          port: 5299
  tls: {}
