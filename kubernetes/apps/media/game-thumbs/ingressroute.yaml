apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: game-thumbs
spec:
  entryPoints:
    - websecure
  routes:
    # No forward-auth: thumbnail URLs are embedded in EPG/playlist output and
    # fetched by media clients that have no Authentik session. The service is
    # read-only image generation.
    # hygiene-exempt: homepage-tile machine-facing -- image URLs consumed by media clients, not browsed to
    - match: Host(`thumbs.${DOMAIN}`)
      kind: Rule
      services:
        - name: game-thumbs
          port: 3000
  tls: {}
