apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: teamarr
  labels:
    homelab.mpdavis.com/exposure: tailnet
spec:
  entryPoints:
    - tailnet
  routes:
    - match: Host(`teamarr.${DOMAIN}`)
      kind: Rule
      middlewares:
        - name: authentik-forward-auth
          namespace: authentik
      services:
        - name: teamarr
          port: 9195
  tls: {}
