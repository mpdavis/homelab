apiVersion: apps/v1
kind: Deployment
metadata:
  name: teamarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: teamarr
  template:
    metadata:
      labels:
        app: teamarr
    spec:
      containers:
        - name: teamarr
          image: ghcr.io/pharaoh-labs/teamarr:2.13.2
          ports:
            - containerPort: 9195
              name: http
          env:
            - name: TZ
              value: ${TZ}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: teamarr-data
