apiVersion: apps/v1
kind: Deployment
metadata:
  name: teamarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: teamarr
  template:
    metadata:
      labels:
        app: teamarr
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: teamarr
          image: ghcr.io/pharaoh-labs/teamarr:2.15.0
          ports:
            - containerPort: 9195
              name: http
          env:
            - name: TZ
              value: ${TZ}
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: teamarr-data
