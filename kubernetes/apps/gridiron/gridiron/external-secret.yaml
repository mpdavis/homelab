apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gridiron-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: gridiron-secrets
  data:
    # CollegeFootballData — every game, drive, play and historical line.
    - secretKey: cfbd-api-key
      remoteRef:
        key: ${BWS_GRIDIRON_CFBD_API_KEY}
    # The Odds API — live Fanatics and DraftKings prices.
    - secretKey: odds-api-key
      remoteRef:
        key: ${BWS_GRIDIRON_ODDS_API_KEY}
