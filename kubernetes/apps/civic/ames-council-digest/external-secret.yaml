apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ames-council-digest-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: ames-council-digest-secrets
  data:
    # opencode zen API key (opencode.ai console -> API keys). Used against the
    # Anthropic-compatible endpoint at https://opencode.ai/zen/v1/messages.
    - secretKey: llm-api-key
      remoteRef:
        key: ${BWS_AMES_LLM_API_KEY}
