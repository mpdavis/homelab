# Hourly check for newly posted Ames City Council agendas and packets.
#
# Each meeting is digested twice: once from the agenda and packet before it
# happens, and again from the minutes about a week later. Hourly polling is
# what makes both land promptly without anyone watching for them.
#
# A run with nothing new costs 9 folder listings against the city's server and
# zero model calls — meetings whose passes are all done are filtered out before
# their documents are ever listed. That puts hourly polling at ~216
# requests/day. A new meeting adds 3 listings, and only then does it cost
# tokens: ~$1.40 for the packet pass, a few cents for the minutes (README).
#
# :17 rather than :00 — nothing depends on the exact minute, and it keeps this
# off the top-of-hour spike that every other scheduled poller lands on.
#
# Delivery is `file`: each digest lands on the PVC as Markdown + HTML. Add the
# ntfy or smtp sink to AMES_DELIVERY below once a destination is settled on.
#
# To pause spend without reverting: suspend: true.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ames-council-digest
spec:
  suspend: false
  schedule: "17 * * * *"
  timeZone: ${TZ}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # A missed window (node down, cluster upgrade) should wait for the next hour
  # rather than fire late into the following one; the meeting will still be
  # there. Kept well under the hourly period for that reason.
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      # A cold run digesting the 3-meeting limit takes ~15 minutes. Capping
      # below the hourly period means a wedged gateway can't still be holding
      # the Forbid lock when the next run is due.
      activeDeadlineSeconds: 2700
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: ames-council-digest
              image: ghcr.io/mpdavis/ames-council-digest:1.0.6 # published by build-ames-council-digest.yml; renovate bumps from here
              args: ["run"]
              env:
                - name: TZ
                  value: ${TZ}
                # Delivery sinks: file writes Markdown + HTML to the PVC.
                # Add ntfy or smtp here once a destination is settled on.
                - name: AMES_DELIVERY
                  value: "file"
                - name: AMES_LLM_BASE_URL
                  value: "https://opencode.ai/zen/v1"
                - name: AMES_LLM_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ames-council-digest-secrets
                      key: llm-api-key
                # Per-item summaries are the bulk of the tokens; the single
                # digest call is where quality shows, so it gets the better model.
                - name: AMES_ITEM_MODEL
                  value: "claude-sonnet-4-5"
                - name: AMES_DIGEST_MODEL
                  value: "claude-sonnet-4-5"
                - name: AMES_STATE_DIR
                  value: /data/state
                - name: AMES_OUTPUT_DIR
                  value: /data/digests
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: ames-council-digest
            # readOnlyRootFilesystem needs a writable /tmp for PDF buffering.
            - name: tmp
              emptyDir: {}
