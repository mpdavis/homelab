apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      initContainers:
        - name: disable-auth
          image: busybox:latest
          command: ['sh', '-c']
          args:
            - |
              CONFIG=/config/config.xml
              if [ -f "$CONFIG" ]; then
                sed -i 's|<AuthenticationMethod>.*</AuthenticationMethod>|<AuthenticationMethod>External</AuthenticationMethod>|' "$CONFIG"
                sed -i 's|<AuthenticationType>.*</AuthenticationType>|<AuthenticationType>External</AuthenticationType>|' "$CONFIG"
              fi
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: prowlarr
          image: linuxserver/prowlarr:latest
          ports:
            - containerPort: 9696
              name: http
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: ${TZ}
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
