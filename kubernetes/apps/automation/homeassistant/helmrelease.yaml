apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homeassistant
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "~5.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    crds: CreateReplace
  values:
    controllers:
      main:
        # local-path RWO PVC — Recreate so rolling updates don't hang trying to
        # mount the volume still attached to the old pod.
        strategy: Recreate
        annotations:
          ignore-check.kube-linter.io/run-as-non-root: "HA runs as root for host integrations and its /config volume is root-owned, so install-hacs must write to it as root"
        initContainers:
          seed-config:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: "2026.9.3"
            command:
              - /bin/sh
              - -c
              - |
                if [ ! -f /config/configuration.yaml ]; then
                  cp /config-init/configuration.yaml /config/configuration.yaml
                fi
          # Bootstrap HACS (https://hacs.xyz) into custom_components on first start
          # only. HACS updates itself from the UI after that, so an existing install
          # is left alone. Downloads the release zip directly instead of piping
          # get.hacs.xyz into bash: that script re-downloads `latest` every run and
          # exits non-zero before HA has written .HA_VERSION on a fresh PVC.
          install-hacs:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: "2026.9.3"
            env:
              HACS_VERSION: "2.0.5"
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                if [ -d /config/custom_components/hacs ]; then
                  echo "HACS already installed, skipping"
                  exit 0
                fi
                # Stage on the config volume: root fs is read-only, and a same-fs
                # mv means a failed download never leaves a partial hacs/ behind.
                tmp=/config/.hacs-install
                rm -rf "$tmp"
                mkdir -p "$tmp" /config/custom_components
                wget -O "$tmp/hacs.zip" \
                  "https://github.com/hacs/integration/releases/download/$HACS_VERSION/hacs.zip"
                unzip -q "$tmp/hacs.zip" -d "$tmp/hacs"
                mv "$tmp/hacs" /config/custom_components/hacs
                rm -rf "$tmp"
                echo "Installed HACS $HACS_VERSION"
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        containers:
          main:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: "2026.9.3"
            # Container-level hardening. HA runs as root (host integrations), so
            # no runAsNonRoot — just drop escalation and all capabilities.
            # hygiene-exempt: runtime-identity HA intentionally runs as root for host
            # integration access (see comment above)
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            env:
              TZ: ${TZ}
    service:
      main:
        controller: main
        ports:
          http:
            port: 8123
    persistence:
      config:
        existingClaim: homeassistant
        globalMounts:
          - path: /config
      config-seed:
        type: configMap
        name: homeassistant-config
        advancedMounts:
          main:
            seed-config:
              - path: /config-init
                readOnly: true
