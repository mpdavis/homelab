apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homeassistant
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "~5.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    crds: CreateReplace
  values:
    controllers:
      main:
        # local-path RWO PVC — Recreate so rolling updates don't hang trying to
        # mount the volume still attached to the old pod.
        strategy: Recreate
        initContainers:
          seed-config:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: "2026.9.1"
            command:
              - /bin/sh
              - -c
              - |
                if [ ! -f /config/configuration.yaml ]; then
                  cp /config-init/configuration.yaml /config/configuration.yaml
                fi
        containers:
          main:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: "2026.9.1"
            # Container-level hardening. HA runs as root (host integrations), so
            # no runAsNonRoot — just drop escalation and all capabilities.
            # hygiene-exempt: runtime-identity HA intentionally runs as root for host
            # integration access (see comment above)
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            env:
              TZ: ${TZ}
    service:
      main:
        controller: main
        ports:
          http:
            port: 8123
    persistence:
      config:
        existingClaim: homeassistant
        globalMounts:
          - path: /config
      config-seed:
        type: configMap
        name: homeassistant-config
        advancedMounts:
          main:
            seed-config:
              - path: /config-init
                readOnly: true
