apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      # Gluetun requires /dev/net/tun which is only available on VM nodes, not LXC
      nodeSelector:
        node-type: vm
      initContainers:
        - name: disable-auth
          image: busybox:latest
          command: ['sh', '-c']
          args:
            - |
              CONF=/config/qBittorrent/qBittorrent.conf
              if [ -f "$CONF" ]; then
                if grep -q 'WebUI\\AuthSubnetWhitelistEnabled' "$CONF"; then
                  sed -i 's|WebUI\\AuthSubnetWhitelistEnabled=.*|WebUI\\AuthSubnetWhitelistEnabled=true|' "$CONF"
                else
                  echo 'WebUI\AuthSubnetWhitelistEnabled=true' >> "$CONF"
                fi
                if grep -q 'WebUI\\AuthSubnetWhitelist=' "$CONF"; then
                  sed -i 's|WebUI\\AuthSubnetWhitelist=.*|WebUI\\AuthSubnetWhitelist=0.0.0.0/0|' "$CONF"
                else
                  echo 'WebUI\AuthSubnetWhitelist=0.0.0.0/0' >> "$CONF"
                fi
              fi
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: gluetun
          image: qmcgaw/gluetun:latest
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: VPN_SERVICE_PROVIDER
              value: protonvpn
            - name: VPN_TYPE
              value: openvpn
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef:
                  name: protonvpn-credentials
                  key: openvpn-user
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: protonvpn-credentials
                  key: openvpn-password
            - name: SERVER_COUNTRIES
              value: Netherlands
            - name: TZ
              value: ${TZ}
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
        - name: qbittorrent
          image: linuxserver/qbittorrent:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: ${TZ}
            - name: WEBUI_PORT
              value: "8080"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: media
          nfs:
            server: ${NAS_IP}
            path: ${NAS_DATA_PATH}/media
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
