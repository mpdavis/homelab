apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ecm
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ecm.mpdavis.com`) && PathPrefix(`/mcp`)
      kind: Rule
      services:
        - name: ecm
          port: 6101
    - match: Host(`ecm.mpdavis.com`)
      kind: Rule
      middlewares:
        - name: authelia
          namespace: authelia
      services:
        - name: ecm
          port: 6100
  tls: {}
