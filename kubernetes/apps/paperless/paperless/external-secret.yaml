apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: paperless-secrets
  data:
    # TODO(maintainer): replace the placeholder UUIDs with the Bitwarden Secrets
    # Manager item IDs before this service can sync (the deployment stays pending
    # until these resolve).
    #   - secret-key: a random 50+ char string (PAPERLESS_SECRET_KEY)
    #   - admin-user / admin-password: the bootstrap superuser credentials
    - secretKey: secret-key
      remoteRef:
        key: REPLACE_ME-paperless-secret-key
    - secretKey: admin-user
      remoteRef:
        key: REPLACE_ME-paperless-admin-user
    - secretKey: admin-password
      remoteRef:
        key: REPLACE_ME-paperless-admin-password
