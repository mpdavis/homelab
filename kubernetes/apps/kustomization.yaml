apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - dispatcharr
  - ollama
  - ecm
  - emby
  - game-thumbs
  - hello-world
  - homepage
  - prowlarr
  - qbittorrent
  - radarr
  - recyclarr
  - seerr
  - sonarr
  - teamarr

# ExternalDNS (traefik-proxy source) only provisions a record for an
# IngressRoute that carries an explicit target annotation — IngressRoute CRDs
# expose no LoadBalancer status to derive one from. Apply it to every
# IngressRoute so new services get a DNS record automatically. 46.110.78.19 is
# the public IP that forwards external traffic to Traefik's VIP (10.0.1.60).
patches:
  - target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
    patch: |-
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: ignored
        annotations:
          external-dns.alpha.kubernetes.io/target: 46.110.78.19
