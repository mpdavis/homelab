apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Homelab
    favicon: https://gethomepage.dev/favicon.ico
    headerStyle: clean
    layout:
      Media:
        style: row
        columns: 3
      IPTV:
        style: row
        columns: 3
      Infrastructure:
        style: row
        columns: 3
      AI:
        style: row
        columns: 3
      Documents:
        style: row
        columns: 3
  bookmarks.yaml: |
    - Development:
        - GitHub Repo:
            - abbr: GH
              href: https://github.com/mpdavis/homelab
  services.yaml: |
    - Media:
        - Emby:
            icon: emby.png
            href: https://emby.mpdavis.com
            description: Media server
        - Sonarr:
            icon: sonarr.png
            href: https://sonarr.mpdavis.com
            description: TV series management
        - Radarr:
            icon: radarr.png
            href: https://radarr.mpdavis.com
            description: Movie management
        - Seerr:
            icon: overseerr.png
            href: https://seerr.mpdavis.com
            description: Media requests
        - qBittorrent:
            icon: qbittorrent.png
            href: https://qbit.mpdavis.com
            description: Torrent client
        - Prowlarr:
            icon: prowlarr.png
            href: https://prowlarr.mpdavis.com
            description: Indexer management
        - Listenarr:
            icon: mdi-headphones
            href: https://listenarr.mpdavis.com
            description: Audiobook management
        - LazyLibrarian:
            icon: lazylibrarian.png
            href: https://lazylibrarian.mpdavis.com
            description: eBook & audiobook management
    - IPTV:
        - Dispatcharr:
            icon: mdi-television-classic
            href: https://dispatcharr.mpdavis.com
            description: IPTV stream dispatcher
        - Teamarr:
            icon: mdi-account-group
            href: https://teamarr.mpdavis.com
            description: IPTV team management
        - ECM:
            icon: mdi-key-variant
            href: https://ecm.mpdavis.com
            description: ECM server
        - StreamFlow:
            icon: mdi-sort-variant
            href: https://streamflow.mpdavis.com
            description: IPTV stream quality ordering
    - AI:
        - Open WebUI:
            icon: open-webui.png
            href: https://ai.mpdavis.com
            description: AI chat interface (Ollama)
    - Documents:
        - Paperless:
            icon: paperless-ngx.png
            href: https://paperless.mpdavis.com
            description: Document management & OCR
    - Infrastructure:
        - Grafana:
            icon: grafana.png
            href: https://grafana.mpdavis.com
            description: Monitoring & dashboards
        - Flux:
            icon: flux-cd.png
            href: https://flux.mpdavis.com
            description: GitOps delivery
        - Traefik:
            icon: traefik.png
            href: https://traefik.mpdavis.com
            description: Ingress controller
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "homelab"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
  custom.css: ""
  custom.js: ""
