apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: immich-db-secret
  data:
    # Shared by the Postgres container (POSTGRES_PASSWORD) and the Immich
    # server/microservices workers (DB_PASSWORD).
    - secretKey: db-password
      remoteRef:
        key: ${BWS_IMMICH_DB_PASSWORD}
