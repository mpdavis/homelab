# hygiene-exempt: homepage-tile demo/test service, not something to browse to regularly
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hello-world
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`hello.${DOMAIN}`)
      kind: Rule
      services:
        - name: hello-world
          port: 80
  tls: {}
