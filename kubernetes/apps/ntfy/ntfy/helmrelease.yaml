apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "~5.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    crds: CreateReplace
  values:
    defaultPodOptions:
      # ntfy reads NTFY_* env vars as config; the Service named "ntfy" would
      # inject legacy service-link vars (NTFY_PORT=tcp://…, NTFY_SERVICE_*)
      # that collide with them. Disable the injection.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # Keep the alert-notification path off the GPU node — it is the node most
      # prone to disk pressure, the very failure we want ntfy to tell us about.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - k3s-agent-gpu
    controllers:
      main:
        containers:
          main:
            image:
              repository: binwiederhier/ntfy
              tag: v2.28.0
            args: ["serve"]
            # ntfy listens on port 80 by default; NET_BIND_SERVICE lets the now
            # non-root uid still bind it (see the pod securityContext above).
            # If #545's capabilities.drop: [ALL] lands first, merge this `add`
            # into that same container securityContext block rather than duplicating it.
            securityContext:
              capabilities:
                add: ["NET_BIND_SERVICE"]
            env:
              TZ: ${TZ}
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
    persistence:
      config-file:
        type: configMap
        name: ntfy-config
        globalMounts:
          - path: /etc/ntfy/server.yml
            subPath: server.yml
            readOnly: true
      cache:
        existingClaim: ntfy
        globalMounts:
          - path: /var/lib/ntfy
