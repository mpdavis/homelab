apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "~5.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    crds: CreateReplace
  values:
    controllers:
      main:
        containers:
          # paperless-ngx web/consumer/scheduler — single image runs all roles
          main:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 2.20.15
            env:
              TZ: ${TZ}
              PAPERLESS_TIME_ZONE: ${TZ}
              # Redis broker runs as a sidecar in this same pod (localhost).
              PAPERLESS_REDIS: redis://localhost:6379
              # Public URL — required so paperless trusts the Traefik origin (CSRF/cookies).
              PAPERLESS_URL: https://paperless.mpdavis.com
              PAPERLESS_PORT: "8000"
              PAPERLESS_SECRET_KEY:
                secretKeyRef:
                  name: paperless-secrets
                  key: secret-key
              PAPERLESS_ADMIN_USER:
                secretKeyRef:
                  name: paperless-secrets
                  key: admin-user
              PAPERLESS_ADMIN_PASSWORD:
                secretKeyRef:
                  name: paperless-secrets
                  key: admin-password
          # Broker for the Celery task queue. State is ephemeral (task queue only).
          redis:
            image:
              repository: docker.io/library/redis
              tag: 8-alpine
    service:
      main:
        controller: main
        ports:
          http:
            port: 8000
    persistence:
      # SQLite DB, search index and classification model — keep local for IOPS.
      data:
        existingClaim: paperless-data
        advancedMounts:
          main:
            main:
              - path: /usr/src/paperless/data
      # Stored documents (originals + archive) — bulk, on the NAS.
      media:
        existingClaim: paperless-media
        advancedMounts:
          main:
            main:
              - path: /usr/src/paperless/media
      # Watched import folder — RWX so files can be dropped over the NAS share.
      consume:
        existingClaim: paperless-consume
        advancedMounts:
          main:
            main:
              - path: /usr/src/paperless/consume
      # Document exports.
      export:
        existingClaim: paperless-export
        advancedMounts:
          main:
            main:
              - path: /usr/src/paperless/export
