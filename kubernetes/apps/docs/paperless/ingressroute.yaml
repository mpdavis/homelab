apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: paperless
  labels:
    homelab.mpdavis.com/exposure: tailnet
spec:
  entryPoints:
    - tailnet
  routes:
    - match: Host(`paperless.${DOMAIN}`)
      kind: Rule
      services:
        - name: paperless
          port: 8000
  tls: {}
