apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
data:
  recyclarr.yml: |
    sonarr:
      sonarr-homelab:
        base_url: http://sonarr:8989
        api_key: !env_var SONARR_API_KEY

        media_naming:
          series: emby-tvdb
          season: default
          episodes:
            rename: true
            standard: default
            daily: default
            anime: default

        quality_definition:
          type: series

        quality_profiles:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1
            reset_unmatched_scores:
              enabled: true
          - trash_id: 9d142234e45d6143785ac55f5a9e8dc9
            reset_unmatched_scores:
              enabled: true

        custom_formats:
          - trash_ids:
              - d7c747094a7c65f4c2de083c24899e8b
            assign_scores_to:
              - name: WEB-1080p
              - name: WEB-1080p (Alternative)
          - trash_ids:
              - 3bc5f395426614e155e585a2f056cdf1
            assign_scores_to:
              - name: WEB-1080p
              - name: WEB-1080p (Alternative)

        custom_format_groups:
          add:
            - trash_id: 158188097a58d7687dee647e04af0da3
              select_all: true
            - trash_id: 59c3af66780d08332fdc64e68297098f
              select_all: true

    radarr:
      radarr-homelab:
        base_url: http://radarr:7878
        api_key: !env_var RADARR_API_KEY

        media_naming:
          folder: emby-tmdb
          movie:
            rename: true
            standard: standard

        quality_definition:
          type: movie

        quality_profiles:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9
            reset_unmatched_scores:
              enabled: true

        custom_format_groups:
          add:
            - trash_id: f8bf8eab4617f12dfdbd16303d8da245
              select_all: true
            - trash_id: a3ac6af01d78e4f21fcb75f601ac96df
              select_all: true
