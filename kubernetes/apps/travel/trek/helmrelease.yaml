apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trek
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "~5.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    crds: CreateReplace
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: mauriceboe/trek
              tag: "3.4.1"
            env:
              TZ: ${TZ}
              APP_URL: https://trek.${DOMAIN}
              ADMIN_EMAIL: ${EMAIL}
              ENCRYPTION_KEY:
                secretKeyRef:
                  name: trek-secrets
                  key: encryption-key
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
    persistence:
      data:
        existingClaim: trek-data
        globalMounts:
          - path: /app/data
      uploads:
        existingClaim: trek-uploads
        globalMounts:
          - path: /app/uploads
