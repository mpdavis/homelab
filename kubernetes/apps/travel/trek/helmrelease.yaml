apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trek
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "~5.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    crds: CreateReplace
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: docker.io/mauriceboe/trek
              tag: "3.1.2"
            env:
              TZ: ${TZ}
              NODE_ENV: production
              PORT: "3000"
              # Public URL — used for email links and CORS / proxy handling.
              APP_URL: https://trek.mpdavis.com
              ALLOWED_ORIGINS: https://trek.mpdavis.com
              TRUST_PROXY: "true"
              ENCRYPTION_KEY:
                secretKeyRef:
                  name: trek-secrets
                  key: encryption-key
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
    persistence:
      data:
        existingClaim: trek-data
        globalMounts:
          - path: /app/data
      uploads:
        existingClaim: trek-uploads
        globalMounts:
          - path: /app/uploads
