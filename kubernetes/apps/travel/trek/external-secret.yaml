apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trek-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: trek-secrets
  data:
    # At-rest encryption key for sensitive fields. Generate with
    # `openssl rand -hex 32`, store it in BWS, and put the UUID in
    # bws-secret-ids as BWS_TREK_ENCRYPTION_KEY.
    - secretKey: encryption-key
      remoteRef:
        key: ${BWS_TREK_ENCRYPTION_KEY}
