apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: github-token
  data:
    - secretKey: token
      remoteRef:
        # TODO: replace with the Bitwarden Secrets Manager UUID of a GitHub PAT
        # that has commit-status write (classic scope: repo:status, or
        # fine-grained: Commit statuses Read and write). Until this points at a
        # real secret the github-token Secret won't sync and the Provider stays
        # NotReady — but this lives in its own non-gating Kustomization, so it
        # does not block infrastructure or apps reconciliation.
        key: 6a623ba5-dc2b-4eea-b989-b46500f1c995
