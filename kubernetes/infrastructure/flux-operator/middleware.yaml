# Forward auth for the Flux UI, against Authentik's embedded outpost on the
# compose host. The outpost port is published there only for this route; both
# go when k3s does.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forward-auth
  namespace: flux-system
spec:
  forwardAuth:
    address: http://${COMPOSE_HOST_IP}:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
