apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flux-web
  namespace: flux-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`flux.${DOMAIN}`)
      kind: Rule
      middlewares:
        - name: authentik-forward-auth
          namespace: authentik
      services:
        - name: flux-operator
          port: 9080
  tls: {}
