apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: "2026.8.1"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    crds: CreateReplace
  values:
    global:
      # Inject secret_key, postgres password, and akadmin bootstrap creds into
      # both the server and worker pods. Bootstrap email is non-sensitive.
      env:
        - name: AUTHENTIK_BOOTSTRAP_EMAIL
          value: ${EMAIL}
      envFrom:
        - secretRef:
            name: authentik-secrets
      # Mount custom blueprints into the server + worker; the worker discovers
      # and applies everything under /blueprints on startup. One projected
      # volume merges all blueprint ConfigMaps into a single directory.
      volumes:
        - name: blueprints-custom
          projected:
            sources:
              - configMap:
                  name: authentik-blueprint-paperless
              - configMap:
                  name: authentik-blueprint-forward-auth
      volumeMounts:
        - name: blueprints-custom
          mountPath: /blueprints/custom
          readOnly: true

    authentik:
      # secret_key + postgres password come from authentik-secrets (envFrom).
      secret_key: ""
      error_reporting:
        enabled: false
      postgresql:
        password: ""

    # Keep the IdP off k3s-agent-gpu: Emby transcodes / NFS traffic saturate that
    # node's CPU and BestEffort pods there get starved (cgroup cpu.weight=1),
    # so probes time out and kubelet restarts the pods. Requests make these
    # pods Burstable; the affinity prefers the idle k3s-agent-1. Postgres stays
    # where it is (local-path PVC is node-bound) but gets requests too.
    server:
      # Ingress is handled by a standalone Traefik IngressRoute, not the chart.
      ingress:
        enabled: false
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
      # 3s is too tight when the DB is on a busy node; allow slow answers
      # rather than restarting the IdP.
      livenessProbe:
        timeoutSeconds: 10
      readinessProbe:
        timeoutSeconds: 10
      startupProbe:
        timeoutSeconds: 10
      affinity: &off-gpu-node
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - k3s-agent-gpu
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3s-agent-1

    worker:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
      # `ak healthcheck` boots Django; under CPU contention it can't finish in 3s.
      livenessProbe:
        timeoutSeconds: 10
      readinessProbe:
        timeoutSeconds: 10
      startupProbe:
        timeoutSeconds: 10
      affinity: *off-gpu-node

    # Bundled PostgreSQL (Bitnami subchart) — persistent on local SSD.
    postgresql:
      enabled: true
      auth:
        username: authentik
        database: authentik
        existingSecret: authentik-postgresql
        secretKeys:
          adminPasswordKey: postgres-password
          userPasswordKey: password
      primary:
        persistence:
          enabled: true
          storageClass: local-path
          size: 8Gi
        resources:
          requests:
            cpu: 100m
            memory: 256Mi

    # Bundled Redis (Bitnami subchart) — cache + task broker, state is ephemeral.
    redis:
      enabled: true
      auth:
        enabled: false
      master:
        persistence:
          enabled: false
