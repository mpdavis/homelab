# Authentik blueprint defining the Paperless OIDC provider + application
# declaratively. Mounted into the server/worker at /blueprints/custom by the
# HelmRelease; the worker discovers and applies it on startup. The client
# secret is injected from the environment (authentik-secrets / BWS) so no
# secret material lives in git — only the non-sensitive client_id does.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-paperless
data:
  paperless.yaml: |
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: paperless-oidc
    entries:
      # Scope mapping that emits a "groups" claim (the user's Authentik group
      # names) so Paperless can sync group membership on login.
      - model: authentik_providers_oauth2.scopemapping
        state: present
        id: scope-groups
        identifiers:
          name: "Paperless OIDC groups"
        attrs:
          scope_name: groups
          description: "Authentik group names, for Paperless group sync"
          expression: |
            return {"groups": [group.name for group in request.user.ak_groups.all()]}
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: provider-paperless
        identifiers:
          name: Paperless
        attrs:
          client_type: confidential
          client_id: 2637be93cafb37442b1abb9bd89330fe
          client_secret: !Env AUTHENTIK_PAPERLESS_OIDC_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://paperless.${DOMAIN}/accounts/oidc/authentik/login/callback/
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !KeyOf scope-groups
          sub_mode: hashed_user_id
      - model: authentik_core.application
        state: present
        identifiers:
          slug: paperless
        attrs:
          name: Paperless
          provider: !KeyOf provider-paperless
          meta_launch_url: https://paperless.${DOMAIN}
          meta_publisher: Paperless-ngx
          meta_description: Document management & OCR
          policy_engine_mode: any
      # Authentik group whose members get the matching Paperless group's
      # permissions via group sync. A Paperless group of the same name must
      # exist (created in Paperless) for the mapping to take effect.
      - model: authentik_core.group
        state: present
        identifiers:
          name: Paperless Admins
        attrs:
          name: Paperless Admins
