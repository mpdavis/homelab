apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
  data:
    # secret_key: cookie signing / unique user IDs — must stay stable after first install
    - secretKey: secret_key
      remoteRef:
        key: ${BWS_AUTHENTIK_SECRET_KEY}
    # Shared by the bundled PostgreSQL subchart (postgresql.auth.password) and
    # authentik's DB connection (authentik.postgresql.password) via valuesFrom.
    - secretKey: postgresql-password
      remoteRef:
        key: ${BWS_AUTHENTIK_POSTGRESQL_PASSWORD}
