# Secrets injected into the authentik server + worker pods via the chart's
# global.envFrom. Keys are upper-snake AUTHENTIK_* env var names the app reads
# directly (secret_key, postgres password, and the akadmin bootstrap creds).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: ${BWS_AUTHENTIK_SECRET_KEY}
    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef:
        key: ${BWS_AUTHENTIK_POSTGRES_PASSWORD}
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        key: ${BWS_AUTHENTIK_BOOTSTRAP_PASSWORD}
    - secretKey: AUTHENTIK_BOOTSTRAP_TOKEN
      remoteRef:
        key: ${BWS_AUTHENTIK_BOOTSTRAP_TOKEN}
    # Consumed by the paperless-oidc blueprint via !Env (OAuth2 client secret).
    - secretKey: AUTHENTIK_PAPERLESS_OIDC_SECRET
      remoteRef:
        key: ${BWS_PAPERLESS_OIDC_CLIENT_SECRET}
---
# Consumed by the bundled Bitnami postgresql subchart via
# postgresql.auth.existingSecret. Both keys carry the same password so the
# postgres superuser and the authentik DB user share it; the value must match
# AUTHENTIK_POSTGRESQL__PASSWORD above so authentik can connect.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-postgresql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: authentik-postgresql
  data:
    - secretKey: password
      remoteRef:
        key: ${BWS_AUTHENTIK_POSTGRES_PASSWORD}
    - secretKey: postgres-password
      remoteRef:
        key: ${BWS_AUTHENTIK_POSTGRES_PASSWORD}
