# Populates "operator-oauth", the Secret name the tailscale-operator chart
# looks for by default when its oauth values block is left empty (see
# kubernetes/infrastructure/controllers/tailscale-operator.yaml). Keys must be
# exactly client_id/client_secret — the chart mounts them as files under those
# names.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: operator-oauth
  data:
    - secretKey: client_id
      remoteRef:
        key: ${BWS_TAILSCALE_OAUTH_CLIENT_ID}
    - secretKey: client_secret
      remoteRef:
        key: ${BWS_TAILSCALE_OAUTH_CLIENT_SECRET}
