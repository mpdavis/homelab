# Public, read-only status page — deliberately NOT behind Authentik so
# /api/v1/endpoints/statuses can be queried without a session (e.g. by the
# diagnose-service agent).
#
# hygiene-exempt: gatus-endpoint Gatus can't probe its own status page
# hygiene-exempt: gatus-hostalias Gatus can't probe its own status page
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gatus
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`status.mpdavis.com`)
      kind: Rule
      services:
        - name: gatus
          port: 80
  tls: {}
