apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki
spec:
  interval: 30m
  chart:
    spec:
      chart: loki
      version: "~17.3.1"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  test:
    enable: true
  values:
    deploymentMode: Monolithic
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      limits_config:
        # Loki's default list, plus `pod` as a last resort. loki-canary pushes
        # straight to the gateway (`-labelname=pod -labelvalue=$(POD_NAME)`)
        # instead of going through Alloy, so its streams carry only `pod` and
        # `stream` — none of the labels below — and every canary line landed
        # under `service_name="unknown_service"` in Grafana. The list is
        # ordered and first-match-wins, so appending `pod` leaves every
        # Alloy-shipped stream (which always has `app`) untouched.
        discover_service_name:
          - service
          - app
          - application
          - app_name
          - name
          - app_kubernetes_io_name
          - container
          - container_name
          - k8s_container_name
          - component
          - workload
          - job
          - k8s_job_name
          - pod
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: local-path
        size: 10Gi
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 1Gi
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    gateway:
      enabled: true
