apiVersion: v1
kind: Namespace
metadata:
  name: arc-systems
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-controller
  namespace: arc-systems
spec:
  interval: 30m
  chart:
    spec:
      # Controller + CRDs (AutoscalingRunnerSet etc.). Installed once cluster-wide;
      # the runner scale set itself is a separate HelmRelease (see arc/runner-set.yaml).
      chart: gha-runner-scale-set-controller
      version: "0.14.2"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      strategy: rollback
