apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m
  chart:
    spec:
      chart: tailscale-operator
      version: "~1.102"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      strategy: rollback
  values:
    # oauth.clientId/clientSecret intentionally left unset here: the chart
    # falls back to a precreated Secret named "operator-oauth" in this
    # namespace when the oauth block is empty (chart default fullname is
    # "operator", regardless of this HelmRelease's name). That Secret is
    # populated by the ExternalSecret in
    # kubernetes/infrastructure/tailscale-operator/.
    operatorConfig:
      # Must match the tagOwners entry granted to the OAuth client in the
      # tailnet's ACL policy (Trust credentials page).
      defaultTags:
        - "tag:k8s-operator"
