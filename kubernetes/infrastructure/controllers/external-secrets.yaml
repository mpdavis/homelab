apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 30m
  chart:
    spec:
      chart: external-secrets
      version: "~2.10.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  test:
    enable: true
  values:
    bitwarden-sdk-server:
      enabled: true
    # Without this the controller's /metrics endpoint is served but never
    # scraped, so there is no externalsecret_* series to alert on and a
    # cluster-wide sync outage stays invisible (#374). Enabling it creates the
    # per-controller metrics Services as well as the ServiceMonitors --
    # metrics.service.enabled is only for non-Prometheus scrapers.
    serviceMonitor:
      enabled: true
      additionalLabels:
        # Not optional. This cluster's Prometheus selects ServiceMonitors
        # cluster-wide but only on this label; without it the ServiceMonitor is
        # created, silently ignored, and looks correct. ExternalSecretMetricsAbsent
        # is what catches this if a future chart bump drops it.
        release: monitoring
