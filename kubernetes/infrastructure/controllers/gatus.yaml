apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: gatus
      version: "~1.5"
      sourceRef:
        kind: HelmRepository
        name: twin
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  # The chart exposes no hostAliases value. Probes for *.mpdavis.com must hit
  # the serving IP directly — resolving the public Cloudflare records from
  # inside the LAN would depend on NAT hairpin through the router. This still
  # exercises routing, the wildcard cert, and Authentik forward-auth.
  # Each hostname goes under the IP that actually answers for it: public routes
  # only listen on the public VIP and tailnet-labelled routes only on the
  # tailnet VIP, so a hostname under the wrong IP fails its probe (404).
  # Services migrated off k3s answer on the compose host's Caddy instead, so
  # they move to ${COMPOSE_TAILNET_IP} as they are cut over. Public hostnames
  # all answer on ${COMPOSE_PUBLIC_IP}, which fronts Traefik for whatever has
  # not moved yet — probing it is what proves the real path works.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: gatus
            patch: |
              - op: add
                path: /spec/template/spec/hostAliases
                value:
                  - ip: ${COMPOSE_PUBLIC_IP}
                    hostnames:
                      - audiobookshelf.mpdavis.com
                      - emby.mpdavis.com
                      - seerr.mpdavis.com
                      - thumbs.mpdavis.com
                      - ntfy.mpdavis.com
                      - iam.mpdavis.com
                      - council.mpdavis.com
                      - homeassistant.mpdavis.com
                  - ip: ${COMPOSE_TAILNET_IP}
                    hostnames:
                      - home.mpdavis.com
                      - podfetch.mpdavis.com
                  - ip: ${TRAEFIK_TAILNET_IP}
                    hostnames:
                      - paperless.mpdavis.com
                      - ecm.mpdavis.com
                      - qbit.mpdavis.com
                      - mousehole.mpdavis.com
                      - grafana.mpdavis.com
                      - ai.mpdavis.com
                      - dispatcharr.mpdavis.com
                      - listenarr.mpdavis.com
                      - prowlarr.mpdavis.com
                      - radarr.mpdavis.com
                      - sonarr.mpdavis.com
                      - teamarr.mpdavis.com
                      - flux.mpdavis.com
                      - gridiron.mpdavis.com
                  - ip: ${INFRA_TAILNET_IP}
                    hostnames:
                      - birdnet.mpdavis.com
                      - proxmox.mpdavis.com
                      - grafana-compose.mpdavis.com
  values:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
    persistence:
      enabled: true
      storageClassName: local-path
      size: 1Gi
      mountPath: /data
    serviceMonitor:
      enabled: true
      interval: 60s
      # kube-prometheus-stack's Prometheus only selects ServiceMonitors
      # carrying the release label of the monitoring HelmRelease.
      labels:
        release: monitoring
    # Deeper per-app API checks later: create an ExternalSecret (gatus-env, in
    # kubernetes/infrastructure/gatus/) whose keys land here via
    #   envFrom: [secretRef: {name: gatus-env}]
    # and reference them as ${VAR} in endpoint headers below — Gatus expands
    # env vars when it loads its config. CAUTION: that ${VAR} syntax is shared
    # with Flux postBuild substitution. Flux leaves undefined variables
    # untouched, so this works — but never name a Gatus env var after a
    # cluster-vars key or any BWS_* key, or Flux will substitute it first.
    config:
      # Required for the ServiceMonitor above — serves Prometheus metrics on
      # the same port under /metrics.
      metrics: true
      storage:
        type: sqlite
        path: /data/data.db
      # Endpoint checks run every 60s (Gatus default interval).
      endpoints:
        # --- external, no forward-auth: healthy == 200 after redirects ---
        - name: homepage
          group: external-open
          url: https://home.mpdavis.com/
          conditions: &open-conditions
            - "[STATUS] == 200"
            - "[CERTIFICATE_EXPIRATION] > 48h"
        - name: paperless
          group: external-open
          url: https://paperless.mpdavis.com/
          conditions: *open-conditions
        - name: audiobookshelf
          group: external-open
          url: https://audiobookshelf.mpdavis.com/
          conditions: *open-conditions
        - name: emby
          group: external-open
          url: https://emby.mpdavis.com/
          conditions: *open-conditions
        - name: seerr
          group: external-open
          url: https://seerr.mpdavis.com/
          conditions: *open-conditions
        - name: podfetch
          group: external-open
          url: https://podfetch.mpdavis.com/
          conditions: *open-conditions
        - name: ecm
          group: external-open
          url: https://ecm.mpdavis.com/
          conditions: *open-conditions
        - name: game-thumbs
          group: external-open
          # Root path has no page; /health is the service's liveness endpoint.
          url: https://thumbs.mpdavis.com/health
          conditions: *open-conditions
        - name: mousehole
          group: external-open
          url: https://mousehole.mpdavis.com/
          conditions: *open-conditions
        - name: grafana
          group: external-open
          url: https://grafana.mpdavis.com/login
          conditions: *open-conditions
        - name: grafana-compose
          group: external-open
          url: https://grafana-compose.mpdavis.com/api/health
          conditions: *open-conditions
        - name: authentik
          group: external-open
          url: https://iam.mpdavis.com/
          conditions: *open-conditions
        - name: ntfy
          group: external-open
          # /v1/health is unauthenticated even with auth-default-access:
          # deny-all, so it's a clean 200 liveness signal.
          url: https://ntfy.mpdavis.com/v1/health
          conditions: *open-conditions
        - name: homeassistant
          group: external-open
          # Home Assistant has its own login; onboarding/login page returns 200.
          # Requires http.trusted_proxies configured in configuration.yaml for
          # requests through Traefik (else HA returns 400 to proxied requests).
          url: https://homeassistant.mpdavis.com/
          conditions: *open-conditions
        # LAN hosts that never ran in the cluster, now served by Caddy on the
        # infra host — probed exactly like in-cluster open services.
        - name: birdnet
          group: external-open
          url: https://birdnet.mpdavis.com/
          conditions: *open-conditions
        - name: proxmox
          group: external-open
          url: https://proxmox.mpdavis.com/
          conditions: *open-conditions
        # --- Authentik forward-auth protected: healthy == 302 to the auth
        # portal (iam.mpdavis.com). `Accept: text/html` exercises the real
        # user-facing browser redirect path.
        # A 200 would mean the middleware is missing — that's a failure. ---
        - name: open-webui
          group: external-auth
          url: https://ai.mpdavis.com/
          client: &auth-client
            ignore-redirect: true
          headers: &auth-headers
            Accept: text/html
          conditions: &auth-conditions
            - "[STATUS] == 302"
            - "[CERTIFICATE_EXPIRATION] > 48h"
        - name: dispatcharr
          group: external-auth
          url: https://dispatcharr.mpdavis.com/
          client: *auth-client
          headers: *auth-headers
          conditions: *auth-conditions
        - name: listenarr
          group: external-auth
          url: https://listenarr.mpdavis.com/
          client: *auth-client
          headers: *auth-headers
          conditions: *auth-conditions
        - name: prowlarr
          group: external-auth
          url: https://prowlarr.mpdavis.com/
          client: *auth-client
          headers: *auth-headers
          conditions: *auth-conditions
        - name: qbittorrent
          group: external-auth
          url: https://qbit.mpdavis.com/
          client: *auth-client
          headers: *auth-headers
          conditions: *auth-conditions
        - name: radarr
          group: external-auth
          url: https://radarr.mpdavis.com/
          client: *auth-client
          headers: *auth-headers
          conditions: *auth-conditions
        - name: sonarr
          group: external-auth
          url: https://sonarr.mpdavis.com/
          client: *auth-client
          headers: *auth-headers
          conditions: *auth-conditions
        - name: teamarr
          group: external-auth
          url: https://teamarr.mpdavis.com/
          client: *auth-client
          headers: *auth-headers
          conditions: *auth-conditions
        - name: flux-ui
          group: external-auth
          url: https://flux.mpdavis.com/
          client: *auth-client
          headers: *auth-headers
          conditions: *auth-conditions
        - name: council-digest
          group: external-auth
          url: https://council.mpdavis.com/
          client: *auth-client
          headers: *auth-headers
          conditions: *auth-conditions
        - name: gridiron
          group: external-auth
          url: https://gridiron.mpdavis.com/
          client: *auth-client
          headers: *auth-headers
          conditions: *auth-conditions
        # --- cluster-internal, no ingress ---
        - name: prometheus
          group: internal
          url: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/-/healthy
          conditions: &internal-conditions
            - "[STATUS] == 200"
        - name: alertmanager
          group: internal
          url: http://monitoring-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093/-/healthy
          conditions: *internal-conditions
        - name: loki
          group: internal
          url: http://loki.loki.svc.cluster.local:3100/ready
          conditions: *internal-conditions
        # The Docker hosts' monitoring backends (infra/monitoring/). Probed from
        # here because the infra host cannot alert on its own outage.
        - name: prometheus-infra
          group: internal
          url: http://${INFRA_TAILNET_IP}:9090/-/healthy
          conditions: *internal-conditions
        - name: loki-infra
          group: internal
          url: http://${INFRA_TAILNET_IP}:3100/ready
          conditions: *internal-conditions
        - name: ollama
          group: internal
          url: http://ollama.ai.svc.cluster.local:11434/api/version
          conditions: *internal-conditions
        # App health for forward-auth services. Their external-auth checks only
        # prove the middleware answers with a 302 — Authentik redirects whether
        # or not the app behind it is up — so these hit the unauthenticated
        # health endpoint on the in-cluster Service directly. Keep both.
        - name: open-webui
          group: internal
          url: http://open-webui.ai.svc.cluster.local:8080/health
          conditions: *internal-conditions
        - name: dispatcharr
          group: internal
          # No dedicated health route; the version API is unauthenticated and
          # served by the Django app.
          url: http://dispatcharr.media.svc.cluster.local:9191/api/core/version/
          conditions: *internal-conditions
        - name: prowlarr
          group: internal
          url: http://prowlarr.media.svc.cluster.local:9696/ping
          conditions: *internal-conditions
        - name: radarr
          group: internal
          url: http://radarr.media.svc.cluster.local:7878/ping
          conditions: *internal-conditions
        - name: sonarr
          group: internal
          url: http://sonarr.media.svc.cluster.local:8989/ping
          conditions: *internal-conditions
        - name: teamarr
          group: internal
          url: http://teamarr.media.svc.cluster.local:9195/health
          conditions: *internal-conditions
        - name: council-digest
          group: internal
          url: http://ames-council-digest-web.civic.svc.cluster.local/healthz
          conditions: *internal-conditions
        - name: gridiron
          group: internal
          url: http://gridiron.gridiron.svc.cluster.local:8080/healthz
          conditions: *internal-conditions
