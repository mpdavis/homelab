apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "~41.6.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  test:
    enable: true
  values:
    ingressClass:
      enabled: true
      isDefaultClass: true
    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true
    # Two LoadBalancer Services front the same Traefik pods:
    #   traefik          ${TRAEFIK_PUBLIC_IP}   web/websecure — the router port-forwards 443 here
    #   traefik-tailnet  ${TRAEFIK_TAILNET_IP}  tailnet-web/tailnet — NOT port-forwarded; reachable
    #                                           only from the LAN and via the Tailscale subnet router
    # A route is private because it is bound to the `tailnet` entrypoint, which only
    # listens behind the second VIP. This does not rely on client source IPs:
    # externalTrafficPolicy is Cluster, so kube-proxy SNATs internet traffic to a LAN
    # node IP and an ipAllowList on 10.0.1.0/24 would let it straight through.
    # Both IPs are pinned so the router port-forward and DNS targets never drift.
    service:
      type: LoadBalancer
      annotations:
        metallb.io/loadBalancerIPs: ${TRAEFIK_PUBLIC_IP}
      additionalServices:
        tailnet:
          annotations:
            metallb.io/loadBalancerIPs: ${TRAEFIK_TAILNET_IP}
          spec:
            type: LoadBalancer
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      tailnet-web:
        port: 8001
        exposedPort: 80
        expose:
          default: false
          tailnet: true
        http:
          redirections:
            entryPoint:
              to: tailnet
              scheme: https
              permanent: true
      tailnet:
        port: 8444
        exposedPort: 443
        expose:
          default: false
          tailnet: true
        http:
          tls:
            enabled: true
