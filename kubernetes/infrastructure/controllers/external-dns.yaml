apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: "~1.21"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    provider:
      name: cloudflare
    sources:
      - traefik-proxy
    domainFilters:
      - mpdavis.com
    # IngressRoute CRDs carry no LoadBalancer status, so set the record target
    # globally. This is the public IP the wildcard *.mpdavis.com used to point
    # at; external traffic hits it and is forwarded to Traefik's VIP (10.0.1.60).
    # As of v0.21, --default-targets is only applied to sources that already
    # provide a target; --force-default-targets is required to inject it into
    # targetless sources like IngressRoutes (which have no LoadBalancer status).
    # Without it the traefik source emits zero endpoints and no records are made.
    extraArgs:
      - --default-targets=46.110.78.19
      - --force-default-targets
    # Full GitOps: create and delete records to match IngressRoutes. The TXT
    # registry (txtOwnerId) scopes deletion to records this instance created,
    # so manually-managed records (e.g. the apex) are never touched.
    policy: sync
    registry: txt
    txtOwnerId: homelab
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token
