apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: "~1.21"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    provider:
      name: cloudflare
    sources:
      - traefik-proxy
    domainFilters:
      - mpdavis.com
    # IngressRoute CRDs carry no LoadBalancer status, so the traefik source has
    # no target for them. Set the record target globally: 46.110.78.19 is the
    # public IP that forwards external traffic to Traefik's VIP (10.0.1.60).
    # As of v0.21, --default-targets only applies to sources that already
    # provide a target, so --force-default-targets is required to inject it into
    # these targetless IngressRoutes. Without it the traefik source emits zero
    # endpoints and no records are created.
    extraArgs:
      - --default-targets=46.110.78.19
      - --force-default-targets
    # Full GitOps: create and delete records to match IngressRoutes. The TXT
    # registry (txtOwnerId) scopes deletion to records this instance created,
    # so manually-managed records (e.g. the apex) are never touched.
    policy: sync
    registry: txt
    txtOwnerId: homelab
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token
