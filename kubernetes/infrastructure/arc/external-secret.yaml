apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    # gha-runner-scale-set reads these exact keys to authenticate as a GitHub App
    # and register the runner scale set against the repo.
    name: arc-github-app
  data:
    - secretKey: github_app_id
      remoteRef:
        # TODO: replace with the Bitwarden Secrets Manager UUID holding the App ID.
        key: REPLACE-WITH-BITWARDEN-UUID-app-id
    - secretKey: github_app_installation_id
      remoteRef:
        # TODO: replace with the Bitwarden UUID holding the App Installation ID.
        key: REPLACE-WITH-BITWARDEN-UUID-installation-id
    - secretKey: github_app_private_key
      remoteRef:
        # TODO: replace with the Bitwarden UUID holding the App private key (PEM).
        key: REPLACE-WITH-BITWARDEN-UUID-private-key
