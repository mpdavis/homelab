apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    # gha-runner-scale-set reads these exact keys to authenticate as a GitHub App
    # and register the runner scale set against the repo.
    name: arc-github-app
  data:
    - secretKey: github_app_id
      remoteRef:
        key: 33c20cb5-2a1f-462f-a5aa-b4650130104a
    - secretKey: github_app_installation_id
      remoteRef:
        key: c30c4ea3-1f96-4a2c-9fbf-b465012ff409
    - secretKey: github_app_private_key
      remoteRef:
        key: 2e6a342b-c3b5-429b-a561-b46501304f77
