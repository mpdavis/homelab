apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set
  namespace: arc-runners
spec:
  interval: 30m
  # Needs the ARC CRDs from the controller. The infrastructure-controllers
  # Kustomization (wait: true) already gates this tier, but make it explicit.
  dependsOn:
    - name: arc-controller
      namespace: arc-systems
  chart:
    spec:
      chart: gha-runner-scale-set
      version: "0.14.2"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    githubConfigUrl: https://github.com/mpdavis/homelab
    # Secret synced by external-secret.yaml (GitHub App credentials).
    githubConfigSecret: arc-github-app
    # This name becomes the `runs-on:` label used by the deploy-health-gate workflow.
    runnerScaleSetName: homelab-deploy-gate
    # Scale to zero when idle; one runner is enough — the merge queue serializes anyway.
    minRunners: 0
    maxRunners: 1
    # Run gate steps directly in the ephemeral runner container (no containerMode /
    # work PVC): the gate is a single kubectl/flux script, so step-pod isolation isn't
    # needed. The runner assumes the read-only Flux-reader SA for in-cluster API access.
    template:
      spec:
        serviceAccountName: deploy-gate-runner
