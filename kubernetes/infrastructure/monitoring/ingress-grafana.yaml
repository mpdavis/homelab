apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
  labels:
    homelab.mpdavis.com/exposure: tailnet
spec:
  entryPoints:
    - tailnet
  routes:
    - match: Host(`grafana.${DOMAIN}`)
      kind: Rule
      services:
        - name: monitoring-grafana
          port: 80
  tls: {}
