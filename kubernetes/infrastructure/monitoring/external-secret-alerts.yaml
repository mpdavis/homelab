apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-secret
  namespace: monitoring
  labels:
    # kube-prometheus-stack's Prometheus only selects rules carrying the
    # release label of the monitoring HelmRelease.
    release: monitoring
spec:
  groups:
    - name: external-secret
      rules:
        # Every ExternalSecret emits a Ready series for BOTH status values --
        # status="True" is 1 and status="False" is 0 while healthy, and they
        # swap when it fails. So this is an equality on the False series, not a
        # presence check.
        #
        # condition="Ready" is load-bearing. On delete, ESO drops the Ready
        # series but sets condition="Deleted",status="False" to 1, which lingers
        # until the controller restarts. Three such series were present when this
        # rule was written, all left behind by ExternalSecrets whose app had been
        # removed from the repo; without the condition filter each would read as
        # a permanent failure.
        #
        # 15m rather than 5m: ESO's refresh interval plus a transient Bitwarden
        # blip should not page.
        - alert: ExternalSecretNotReady
          expr: externalsecret_status_condition{condition="Ready",status="False"} == 1
          for: 15m
          labels:
            severity: critical
            ai_triage: "true"
          annotations:
            summary: "ExternalSecret not syncing: {{ $labels.namespace }}/{{ $labels.name }}"
            description: >-
              {{ $labels.namespace }}/{{ $labels.name }} has been Ready=False for
              15 minutes. With deletionPolicy Retain the existing Secret keeps
              serving, so workloads look healthy while the credential goes stale --
              nothing else will surface this.
        # Catches a store erroring without flipping Ready. Must be a rate:
        # externalsecret_sync_calls_error is a cumulative counter and several
        # ExternalSecrets carry a nonzero historical count, so a bare "> 0"
        # would fire permanently.
        - alert: ExternalSecretSyncErrors
          expr: rate(externalsecret_sync_calls_error[15m]) > 0
          for: 15m
          labels:
            severity: warning
            ai_triage: "true"
          annotations:
            summary: "ExternalSecret sync errors: {{ $labels.namespace }}/{{ $labels.name }}"
            description: >-
              {{ $labels.namespace }}/{{ $labels.name }} is returning sync errors
              from the provider without having flipped Ready=False.
        # The one that matters most. It catches ESO being down, the
        # ServiceMonitor not being selected (the release label getting dropped in
        # a chart bump), and the chart's serviceMonitor.renderMode=skipIfMissing
        # quietly rendering nothing. Without it the two rules above can go silent
        # and the whole ruleset reads as healthy -- which is the exact pathology
        # this alerting exists to close. GatusAbsent is the precedent.
        - alert: ExternalSecretMetricsAbsent
          expr: absent(externalsecret_status_condition)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ExternalSecret metrics absent — secret syncing is unmonitored."
            description: >-
              Prometheus has not scraped any externalsecret_status_condition
              series for 15 minutes. ESO is down, or its ServiceMonitor is no
              longer selected and the other ExternalSecret alerts are blind.
