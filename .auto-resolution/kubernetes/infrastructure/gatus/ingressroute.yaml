# Public, read-only status page — deliberately NOT behind Authentik: the
# deploy-canary GitHub workflow polls /api/v1/endpoints/statuses from the
# internet after each merge to verify the deploy actually serves traffic.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gatus
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`status.mpdavis.com`)
      kind: Rule
      services:
        - name: gatus
          port: 80
  tls: {}
