# Traefik forward-auth middleware backed by Authentik's embedded outpost.
# Services opt in via IngressRoute middlewares:
#   - name: authentik-forward-auth
#     namespace: authentik
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forward-auth
spec:
  forwardAuth:
    # Cluster-internal service endpoint of the embedded outpost, not the ingress.
    address: http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
