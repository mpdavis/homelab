# nginx config for the digest web server. The digests are static HTML the
# CronJob writes to the shared PVC, so this is a pure file server.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ames-council-digest-web
data:
  default.conf: |
    limit_req_zone $binary_remote_addr zone=council_digest:10m rate=30r/m;
    server {
        listen 8080;
        server_name _;
        charset utf-8;

        root /srv/digests;
        # index.html is regenerated by the digest job on every run, so there is
        # no need for autoindex — and leaving it off means a missing index
        # reads as a clear 404 rather than a bare file listing.
        index index.html;

        location / {
            limit_req zone=council_digest burst=10 nodelay;
            try_files $uri $uri/ =404;
        }

        location = /styles.css {
            expires 1d;
            add_header Cache-Control "public, max-age=86400, immutable";
            try_files $uri =404;
        }

        location ~* \.(?:html|md|json)$ {
            expires 5m;
            add_header Cache-Control "public, max-age=300, must-revalidate";
            try_files $uri =404;
        }

        # Serve the Markdown alongside each digest as text the browser renders
        # inline; nginx's default type for .md prompts a download instead.
        location ~ \.md$ {
            default_type text/plain;
            charset utf-8;
        }

        # Unauthenticated liveness endpoint for the kubelet probes. Traefik's
        # forward-auth sits in front of the route, so this is only reachable
        # from inside the cluster.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
