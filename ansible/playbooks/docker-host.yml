---
# Provisions the Docker Compose host and starts doco-cd, which then deploys
# docker/apps/ from this repo. See docs/compose.md for the runbook.
#
#   tofu -chdir=tofu/proxmox apply
#   ansible-playbook playbooks/docker-host.yml

- name: Prepare Docker hosts
  hosts: docker
  become: true
  roles:
    - common

- name: Configure VM guests
  hosts: docker:&vm
  become: true
  roles:
    - vm

- name: Configure Docker hosts
  hosts: docker
  become: true
  vars_prompt:
    - name: bws_access_token
      prompt: "Bitwarden Secrets Manager access token for this host's machine account (blank keeps the current one)"
      private: true
      default: ""
  roles:
    - docker
    - service_ips
    - role: doco_cd
      vars:
        doco_cd_bws_access_token: "{{ bws_access_token }}"

- name: GPU setup
  hosts: docker:&gpu
  become: true
  roles:
    - gpu
