---
- name: Prepare SSH trust between PVE nodes
  hosts: pve
  tasks:
    - name: Ensure root SSH key exists
      ansible.builtin.user:
        name: root
        generate_ssh_key: true
        ssh_key_type: ed25519

    - name: Read root public key
      ansible.builtin.slurp:
        src: /root/.ssh/id_ed25519.pub
      register: root_pub_key

    - name: Read SSH host key
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_host_ed25519_key.pub
      register: host_pub_key

    - name: Store public keys as facts
      ansible.builtin.set_fact:
        pve_root_pub_key: "{{ root_pub_key.content | b64decode | trim }}"
        pve_host_pub_key: "{{ (host_pub_key.content | b64decode).split()[:2] | join(' ') }}"

- name: Distribute SSH keys across PVE nodes
  hosts: pve
  tasks:
    - name: Authorize all PVE nodes' root keys
      ansible.posix.authorized_key:
        user: root
        key: "{{ hostvars[item].pve_root_pub_key }}"
      loop: "{{ groups['pve'] }}"
      when: item != inventory_hostname

    # Read from each node over the inventory connection rather than scanned
    # over the network, so the trust is not first-use.
    - name: Trust host keys for all PVE nodes
      ansible.builtin.known_hosts:
        path: /root/.ssh/known_hosts
        name: "{{ hostvars[item].ansible_host }}"
        key: "{{ hostvars[item].ansible_host }} {{ hostvars[item].pve_host_pub_key }}"
        hash_host: true
      loop: "{{ groups['pve'] }}"
      when: item != inventory_hostname

- name: Create Proxmox cluster on seed node
  hosts: pve[0]
  tasks:
    - name: Check if cluster already exists
      ansible.builtin.command: pvecm status
      register: cluster_status
      changed_when: false
      failed_when: false

    - name: Create cluster
      ansible.builtin.command: pvecm create {{ pve_cluster_name }}
      when: cluster_status.rc != 0
      changed_when: true

- name: Join remaining nodes to cluster
  hosts: pve:!pve[0]
  serial: 1
  tasks:
    - name: Check if already in cluster
      ansible.builtin.command: pvecm status
      register: cluster_status
      changed_when: false
      failed_when: false

    - name: Join cluster
      ansible.builtin.command: pvecm add {{ pve_seed_ip }} --use_ssh
      when: cluster_status.rc != 0
      changed_when: true
