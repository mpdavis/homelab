---
- name: Common setup
  hosts: k3s_cluster
  become: true
  roles:
    - common

- name: VM-specific setup
  hosts: k3s_cluster
  become: true
  roles:
    - role: vm
      when: node_type == 'vm'

- name: LXC-specific setup
  hosts: k3s_cluster
  become: true
  roles:
    - role: lxc
      when: node_type == 'lxc'

- name: GPU setup
  hosts: k3s-agent-gpu
  become: true
  roles:
    - gpu

- name: Install k3s server
  hosts: k3s_server
  become: true
  roles:
    - k3s_server

- name: Join k3s agents
  hosts: k3s_agent
  become: true
  roles:
    - k3s_agent

- name: Label GPU node
  hosts: k3s_server
  become: true
  tasks:
    - name: Apply nvidia.com/gpu label to GPU node
      ansible.builtin.command: >
        k3s kubectl label node k3s-agent-gpu
        nvidia.com/gpu=present --overwrite
      changed_when: true
