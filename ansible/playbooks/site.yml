---
- name: Common setup
  hosts: k3s_cluster
  become: true
  roles:
    - common

- name: GPU setup
  hosts: k3s-agent-gpu
  become: true
  roles:
    - gpu

- name: Install k3s server
  hosts: k3s_server
  become: true
  roles:
    - k3s_server

- name: Join k3s agents
  hosts: k3s_agent
  become: true
  roles:
    - k3s_agent
