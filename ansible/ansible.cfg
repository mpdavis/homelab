[defaults]
inventory = inventory
roles_path = roles

[inventory]
# inventory/network.yml fails to parse without network.yaml; stop
# rather than fall back to connecting by hostname.
any_unparsed_is_failed = true

[ssh_connection]
# Learn a new host's key on first contact but refuse one that changed. A guest
# Tofu rebuilds gets a new key: `ssh-keygen -R <ip>` before re-running.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
