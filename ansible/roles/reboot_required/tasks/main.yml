---
# Ubuntu's package hooks (kernel, libc, systemd) drop this file when the
# running system is stale.
- name: Check whether an update needs a reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_flag

- name: Reboot
  ansible.builtin.reboot:
    reboot_timeout: 900
  when: reboot_required_flag.stat.exists
