---
- name: Create /etc/homelab
  ansible.builtin.file:
    path: /etc/homelab
    state: directory
    mode: "0700"

- name: Store the Bitwarden access token
  ansible.builtin.copy:
    content: "{{ doco_cd_bws_access_token }}"
    dest: "{{ doco_cd_bws_token_file }}"
    mode: "0600"
  when: doco_cd_bws_access_token | length > 0
  no_log: true

- name: Check for a Bitwarden access token
  ansible.builtin.stat:
    path: "{{ doco_cd_bws_token_file }}"
  register: doco_cd_token_stat

- name: Require a Bitwarden access token
  ansible.builtin.assert:
    that: doco_cd_token_stat.stat.exists
    fail_msg: >-
      No Bitwarden access token on the host yet. Re-run and enter one at the
      prompt; doco-cd resolves every external_secret with it.

# doco-cd deploys its own stack (docker/doco-cd/compose.yaml) once it is running, so
# this role only starts the first instance: on a new host, or to hand over an
# instance that predates self-update. After that, a compose change is a merge,
# and re-running the playbook must not roll back what doco-cd deployed.
- name: Check whether doco-cd manages itself
  ansible.builtin.command: >-
    docker ps --quiet
    --filter label=com.docker.compose.project=doco-cd
    --filter label=cd.doco.metadata.manager=doco-cd
  register: doco_cd_self_managed
  changed_when: false

- name: Check for the doco-cd data volume
  ansible.builtin.command: docker volume inspect doco-cd_data
  register: doco_cd_volume
  changed_when: false
  failed_when: false

# External in the compose file so a self-update can never recreate it.
- name: Create the doco-cd data volume
  ansible.builtin.command: docker volume create doco-cd_data
  when: doco_cd_volume.rc != 0
  changed_when: true

- name: Start doco-cd
  when: doco_cd_self_managed.stdout | length == 0
  block:
    - name: Create the doco-cd directory
      ansible.builtin.file:
        path: "{{ doco_cd_dir }}"
        state: directory
        mode: "0755"

    - name: Copy the doco-cd compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/doco-cd/compose.yaml"
        dest: "{{ doco_cd_dir }}/compose.yaml"
        mode: "0644"

    - name: Apply the doco-cd instance
      ansible.builtin.command: >-
        docker compose --project-name doco-cd
        --file {{ doco_cd_dir }}/compose.yaml
        up --detach --wait
      environment:
        DOCO_TARGET: "{{ doco_cd_target }}"
      register: doco_cd_up
      # compose reports what it did on stderr and is a no-op when nothing changed.
      changed_when: >-
        'Created' in doco_cd_up.stderr or
        'Recreated' in doco_cd_up.stderr or
        'Started' in doco_cd_up.stderr
