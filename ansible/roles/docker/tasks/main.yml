---
- name: Ensure apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker package signing key
  ansible.builtin.get_url:
    url: "{{ docker_apt_keyring_url }}"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: "{{ docker_apt_repo }}"
    filename: docker
    state: present

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Configure the Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Restart docker

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: List Docker networks
  ansible.builtin.command: docker network ls --format '{{ "{{" }} .Name {{ "}}" }}'
  register: docker_network_list
  changed_when: false
  when: docker_networks | length > 0

- name: Create shared Docker networks
  ansible.builtin.command: "docker network create {{ item }}"
  loop: "{{ docker_networks }}"
  when: item not in docker_network_list.stdout_lines
  changed_when: true
