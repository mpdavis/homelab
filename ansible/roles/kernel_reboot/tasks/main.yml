---
# Debian, unlike Ubuntu, leaves no reboot-required flag, and a Pi's kernel
# flavours (rpi-v8, rpi-2712) defeat comparing version strings. Every kernel
# package writes its modules directory, so one newer than the boot means the
# running kernel is stale.
- name: Find installed kernels' modules
  ansible.builtin.find:
    paths: /lib/modules
    file_type: directory
  register: kernel_reboot_modules

- name: Reboot onto the new kernel
  ansible.builtin.reboot:
    reboot_timeout: 900
  when: >-
    kernel_reboot_modules.files | map(attribute='mtime') | max
    > ansible_facts.date_time.epoch | int - ansible_facts.uptime_seconds
