---
- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: common_cloud_init_result.rc not in [0, 2]
  register: common_cloud_init_result

- name: Write resolv.conf without search domain
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: "{% for server in network.dns %}nameserver {{ server }}\n{% endfor %}"
    mode: "0644"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - nfs-common
    state: present

# Reboot rather than hang on a kernel panic, since nobody is at the console.
- name: Set panic and overcommit sysctls
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-homelab.conf
    reload: true
  loop:
    - { key: kernel.panic, value: "10" }
    - { key: kernel.panic_on_oops, value: "1" }
    - { key: vm.overcommit_memory, value: "1" }
  when: node_type == 'vm'

# Where these settings lived before the rename; drop once no host has it.
- name: Remove the previous sysctl file
  ansible.builtin.file:
    path: /etc/sysctl.d/99-k3s.conf
    state: absent
  when: node_type == 'vm'
