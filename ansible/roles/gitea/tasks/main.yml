---
- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: cloud_init_result.rc not in [0, 2]
  register: cloud_init_result

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - git
      - curl
    state: present

- name: Create gitea system user
  ansible.builtin.user:
    name: gitea
    system: true
    shell: /bin/bash
    home: /home/gitea
    create_home: true

- name: Create Gitea directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: gitea
    group: gitea
    mode: "0750"
  loop:
    - /etc/gitea
    - /var/lib/gitea
    - /var/lib/gitea/custom
    - /var/lib/gitea/data
    - /var/lib/gitea/log

- name: Download Gitea binary
  ansible.builtin.get_url:
    url: "https://dl.gitea.com/gitea/{{ gitea_version }}/gitea-{{ gitea_version }}-linux-amd64"
    dest: /usr/local/bin/gitea
    mode: "0755"
  notify: restart gitea

- name: Create Gitea configuration
  ansible.builtin.template:
    src: app.ini.j2
    dest: /etc/gitea/app.ini
    owner: gitea
    group: gitea
    mode: "0640"
  notify: restart gitea

- name: Create Gitea systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/gitea.service
    mode: "0644"
    content: |
      [Unit]
      Description=Gitea (Git with a cup of tea)
      After=network.target

      [Service]
      Type=simple
      User=gitea
      Group=gitea
      WorkingDirectory=/var/lib/gitea
      ExecStart=/usr/local/bin/gitea web --config /etc/gitea/app.ini
      Restart=always
      Environment=USER=gitea HOME=/home/gitea GITEA_WORK_DIR=/var/lib/gitea

      [Install]
      WantedBy=multi-user.target
  notify: restart gitea

- name: Enable and start Gitea
  ansible.builtin.systemd:
    name: gitea
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for Gitea to be ready
  ansible.builtin.uri:
    url: "http://localhost:3000/api/v1/version"
    status_code: 200
  register: gitea_ready
  retries: 30
  delay: 2
  until: gitea_ready.status == 200

- name: Create admin user
  ansible.builtin.command: >
    /usr/local/bin/gitea admin user create
    --config /etc/gitea/app.ini
    --username {{ gitea_admin_user }}
    --password {{ gitea_admin_password }}
    --email {{ gitea_admin_email }}
    --admin
  become: true
  become_user: gitea
  register: gitea_user_create
  changed_when: gitea_user_create.rc == 0
  failed_when: gitea_user_create.rc != 0 and 'already exists' not in gitea_user_create.stderr

- name: Create mirror of homelab repo
  ansible.builtin.uri:
    url: "http://localhost:3000/api/v1/repos/migrate"
    method: POST
    body_format: json
    body:
      clone_addr: "{{ gitea_mirror_source }}"
      repo_name: homelab
      repo_owner: "{{ gitea_admin_user }}"
      mirror: true
      mirror_interval: "10m"
    headers:
      Authorization: "Basic {{ (gitea_admin_user + ':' + gitea_admin_password) | b64encode }}"
    status_code: [201, 409]
  register: mirror_result
  changed_when: mirror_result.status == 201
