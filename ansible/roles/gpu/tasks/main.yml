---
- name: Install NVIDIA driver prerequisites
  ansible.builtin.apt:
    name:
      - build-essential
      - linux-headers-{{ ansible_kernel }}
    state: present

# Upstream publishes the list only as a file to sed, and the key armored for
# gpg --dearmor; get_url alone can do neither.
- name: Add NVIDIA container toolkit GPG key  # noqa: command-instead-of-module
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey \
      | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  args:
    creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    executable: /bin/bash

- name: Add NVIDIA container toolkit repository  # noqa: command-instead-of-module
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list \
      | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' \
      > /etc/apt/sources.list.d/nvidia-container-toolkit.list
  args:
    creates: /etc/apt/sources.list.d/nvidia-container-toolkit.list
    executable: /bin/bash

- name: Update apt cache after adding NVIDIA repo
  ansible.builtin.apt:
    update_cache: true
  register: gpu_apt_cache
  until: gpu_apt_cache is success
  retries: 3
  delay: 5

- name: Install NVIDIA drivers and container toolkit
  ansible.builtin.apt:
    name:
      - nvidia-driver-580
      - nvidia-container-toolkit
    state: present
  register: gpu_install
  until: gpu_install is success
  retries: 3
  delay: 5

# Stacks request the GPU through CDI. The toolkit's nvidia-cdi-refresh unit
# writes /var/run/cdi/nvidia.yaml and rewrites it when the driver changes, so
# daemon.json (owned by the docker role) needs no runtime entry and Docker no
# restart. `--gpus` and `driver: nvidia` would need one: Docker only looks for
# the toolkit's hook when the daemon starts.

# A freshly built DKMS module is not loaded until the next boot.
- name: Check whether the driver is loaded
  ansible.builtin.command: nvidia-smi
  register: gpu_nvidia_smi_probe
  changed_when: false
  failed_when: false

- name: Reboot to load the driver
  ansible.builtin.reboot:
  when: gpu_nvidia_smi_probe.rc != 0

- name: Verify GPU is visible
  ansible.builtin.command: nvidia-smi
  register: gpu_nvidia_smi
  changed_when: false

- name: Display GPU info
  ansible.builtin.debug:
    var: gpu_nvidia_smi.stdout_lines
