---
- name: Remove apparmor
  ansible.builtin.apt:
    name: apparmor
    state: absent
    purge: true

- name: Create /dev/kmsg symlink
  ansible.builtin.file:
    src: /dev/console
    dest: /dev/kmsg
    state: link
    force: true

- name: Persist /dev/kmsg symlink across reboots
  ansible.builtin.template:
    src: rc.local.j2
    dest: /etc/rc.local
    mode: "0755"

- name: Read the root mount's propagation
  ansible.builtin.command: findmnt --noheadings --output PROPAGATION /
  register: lxc_root_propagation
  changed_when: false
  check_mode: false

# ansible.posix.mount manages fstab entries; it cannot change propagation.
- name: Make mount shared  # noqa: command-instead-of-module
  ansible.builtin.command: mount --make-rshared /
  when: "'shared' not in lxc_root_propagation.stdout"
  changed_when: true
