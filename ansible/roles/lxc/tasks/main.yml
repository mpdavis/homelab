---
- name: Remove apparmor
  ansible.builtin.apt:
    name: apparmor
    state: absent
    purge: true

- name: Create /dev/kmsg symlink
  ansible.builtin.file:
    src: /dev/console
    dest: /dev/kmsg
    state: link
    force: true

- name: Persist /dev/kmsg symlink across reboots
  ansible.builtin.copy:
    dest: /etc/rc.local
    mode: "0755"
    content: |
      #!/bin/sh
      [ ! -e /dev/kmsg ] && ln -s /dev/console /dev/kmsg
      mount --make-rshared /
      exit 0

# ansible.posix.mount manages fstab entries; it cannot change propagation.
- name: Make mount shared  # noqa: command-instead-of-module
  ansible.builtin.command: mount --make-rshared /
  changed_when: false
