all:
  children:
    pve:
      hosts:
        pve1:
        pve2:

    # --- Guests, by what they do. VMIDs and sizing live in tofu/proxmox.

    docker_hosts:
      hosts:
        docker:
          # Caddy binds one of these per exposure: public (the router's 443
          # forward target) and tailnet (never forwarded).
          service_ips_addresses:
            - "{{ network.service_ips.compose_public }}/{{ network.prefix }}"
            - "{{ network.service_ips.compose_tailnet }}/{{ network.prefix }}"
          docker_networks:
            - proxy
        infra:
          # Selects docker/doco-cd/.doco-cd.infra.yaml, so this host deploys docker/infra/
          # rather than docker/stacks/. Caddy binds the host IP directly — one
          # exposure here, so it needs no extra service IPs.
          doco_cd_target: infra
          docker_networks:
            - proxy

    # Holds the passthrough GPU (the `gpu` mapping in tofu/proxmox).
    gpu:
      hosts:
        docker:

    tailscale_router:
      hosts:
        tailscale-router:
    development:
      hosts:
        devbox:

    # --- Guests, by how Tofu creates them (containers vs vms).

    lxc:
      hosts:
        tailscale-router:
        devbox:
    vm:
      hosts:
        docker:
        infra:
