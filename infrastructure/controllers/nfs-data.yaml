apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-data
  namespace: nfs-data
spec:
  interval: 30m
  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      version: "~4.0"
      sourceRef:
        kind: HelmRepository
        name: nfs-provisioner
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    nfs:
      server: 10.0.1.6
      path: /var/nfs/shared/data
    storageClass:
      name: nfs-data
      defaultClass: false
      reclaimPolicy: Retain
      archiveOnDelete: true
      accessModes: ReadWriteMany
