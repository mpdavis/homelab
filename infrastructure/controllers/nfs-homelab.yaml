apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-homelab
  namespace: nfs-homelab
spec:
  interval: 30m
  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      version: "~4.0"
      sourceRef:
        kind: HelmRepository
        name: nfs-provisioner
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    nfs:
      server: ${NAS_IP}
      path: ${NAS_HOMELAB_PATH}
    storageClass:
      name: nfs-homelab
      defaultClass: false
      reclaimPolicy: Retain
      archiveOnDelete: true
      accessModes: ReadWriteMany
