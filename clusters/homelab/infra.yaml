apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/mpdavis/homelab.git
              revision: HEAD
              directories:
                - path: infra/*
          - list:
              elementsYaml: |
                {{ if eq .path.basename "monitoring" "loki" }}
                - category: monitoring
                {{ else if eq .path.basename "traefik" "metallb" "cert-manager" }}
                - category: networking
                {{ else if eq .path.basename "nfs-data" "nfs-homelab" }}
                - category: storage
                {{ else if eq .path.basename "external-secrets" }}
                - category: secrets
                {{ else }}
                - category: platform
                {{ end }}
  template:
    metadata:
      name: "{{.path.basename}}"
      labels:
        tier: infra
        category: "{{.category}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/mpdavis/homelab.git
        targetRevision: HEAD
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /spec/conversion
            - /spec/versions
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - .spec.data[].remoteRef.conversionStrategy
            - .spec.data[].remoteRef.decodingStrategy
            - .spec.data[].remoteRef.metadataPolicy
