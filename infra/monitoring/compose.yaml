name: monitoring

# This host's agent: container logs, host and container metrics, and
# doco-cd's metrics, pushed to Grafana Cloud. Alert rules and routing live in
# grafana-cloud/. stacks/monitoring/ runs the same agent.
services:
  alloy:
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      HOST_LABEL: infra
      # Not secret: the stack's endpoints and instance ids, from the stack's
      # details page on grafana.com.
      GRAFANA_CLOUD_PROMETHEUS_URL: https://prometheus-prod-56-prod-us-east-2.grafana.net/api/prom/push
      GRAFANA_CLOUD_PROMETHEUS_USER: "3611114"
      GRAFANA_CLOUD_LOKI_URL: https://logs-prod-036.grafana.net/loki/api/v1/push
      GRAFANA_CLOUD_LOKI_USER: "1801225"
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:?resolved by doco-cd from external_secrets}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Holds the remote-write WAL, so an internet outage of a few hours is
      # backfilled rather than lost.
      - alloy-data:/var/lib/alloy/data
    networks:
      - default
      - doco-cd

  # Host network, or it reports the container's network interfaces instead of
  # the host's.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      # Every container adds a veth; at ~20 series each they would eat the
      # series budget while saying nothing cAdvisor doesn't.
      - --collector.netdev.device-exclude=^(veth.*|br-.*|docker0)$$
      - --collector.netclass.ignored-devices=^(veth.*|br-.*|docker0)$$
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,hugetlb,referenced_memory,cpu_topology,resctrl,process,perf_event,memory_numa
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

volumes:
  alloy-data:

networks:
  # doco-cd's own project network, created by the doco_cd Ansible role, so
  # Alloy can scrape its metrics on :9120.
  doco-cd:
    name: doco-cd_default
    external: true
