apiVersion: 1

# Fixed uids, so dashboards added later can reference them.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    editable: false
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    access: proxy
    editable: false
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    url: http://alertmanager:9093
    access: proxy
    editable: false
    jsonData:
      implementation: prometheus
