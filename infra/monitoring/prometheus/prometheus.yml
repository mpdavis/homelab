# Host and container metrics arrive by remote write from each host's Alloy
# (see alloy/config.alloy). Only this stack's own services are scraped here.
global:
  scrape_interval: 60s
  evaluation_interval: 60s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: {host: infra}
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels: {host: infra}
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels: {host: infra}
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels: {host: infra}
