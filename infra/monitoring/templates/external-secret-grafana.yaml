apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: grafana-admin
  data:
    - secretKey: admin-user
      remoteRef:
        key: 84b2fe83-0a83-4b84-8f5d-b3e001210112
        property: username
    - secretKey: admin-password
      remoteRef:
        key: 84b2fe83-0a83-4b84-8f5d-b3e001210112
        property: password
