apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml
configMapGenerator:
  - name: homepage
    files:
      - config/kubernetes.yaml
      - config/settings.yaml
      - config/bookmarks.yaml
      - config/services.yaml
      - config/widgets.yaml
      - config/docker.yaml
      - config/custom.css
      - config/custom.js
