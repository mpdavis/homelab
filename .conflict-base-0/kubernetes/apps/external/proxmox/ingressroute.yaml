apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: proxmox
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`proxmox.${DOMAIN}`)
      kind: Rule
      services:
        - name: proxmox
          port: 8006
          # Proxmox speaks HTTPS upstream; skip its self-signed cert via the
          # ServersTransport in this namespace. Traefik proxies the noVNC /
          # xterm console websockets transparently.
          scheme: https
          serversTransport: proxmox
          passHostHeader: true
  tls: {}
