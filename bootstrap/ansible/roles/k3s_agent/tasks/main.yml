---
- name: Get k3s token from server
  ansible.builtin.set_fact:
    k3s_token: "{{ hostvars[groups['k3s_server'][0]]['k3s_token'] }}"

- name: Check if k3s agent is already installed
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s-agent.service
  register: k3s_agent_installed

- name: Install k3s agent
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | K3S_URL=https://{{ k3s_server_ip }}:6443 K3S_TOKEN={{ k3s_token }} sh -s - \
      --kubelet-arg=protect-kernel-defaults=true  # LXC: /proc/sys is read-only
  when: not k3s_agent_installed.stat.exists

- name: Ensure k3s-agent is running
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
