---
- name: Ensure apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add NodeSource package signing key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"

- name: Add NodeSource apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ devbox_node_major }}.x nodistro main"
    filename: nodesource
    state: present

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Read globally installed npm packages
  ansible.builtin.command: npm list --global --depth=0 --json
  register: devbox_npm_global
  changed_when: false
  # npm exits non-zero on an unmet peer dependency, which says nothing about
  # the versions installed.
  failed_when: false

- name: Install agent CLIs
  ansible.builtin.command: "npm install --global {{ item.name }}@{{ item.version }}"
  loop:
    - { name: "@anthropic-ai/claude-code", version: "{{ devbox_claude_code_version }}" }
    - { name: "opencode-ai", version: "{{ devbox_opencode_version }}" }
  vars:
    # default('{}', true) covers empty stdout as well as undefined — from_json
    # on "" is a hard failure.
    installed: "{{ ((devbox_npm_global.stdout | default('{}', true) | from_json).dependencies | default({})) }}"
  when: (installed[item.name] | default({})).version | default('') != item.version
  changed_when: true

- name: Install kubectl
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ devbox_kubectl_version }}/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: "0755"

- name: Install flux
  ansible.builtin.unarchive:
    src: "https://github.com/fluxcd/flux2/releases/download/{{ devbox_flux_version }}/flux_{{ devbox_flux_version | regex_replace('^v', '') }}_linux_amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include:
      - flux
    mode: "0755"
    creates: /usr/local/bin/flux

- name: Install gh
  ansible.builtin.unarchive:
    src: "https://github.com/cli/cli/releases/download/{{ devbox_gh_version }}/gh_{{ devbox_gh_version | regex_replace('^v', '') }}_linux_amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    mode: "0755"
    extra_opts:
      - --strip-components=2
      - --wildcards
      - "*/bin/gh"
    creates: /usr/local/bin/gh

- name: Install mise
  ansible.builtin.shell:
    cmd: "curl -fsSL {{ devbox_mise_install_url }} | sh"
    creates: "/home/{{ devbox_user }}/.local/bin/mise"
  become_user: "{{ devbox_user }}"
  environment:
    MISE_INSTALL_PATH: "/home/{{ devbox_user }}/.local/bin/mise"

- name: Install herdr
  ansible.builtin.shell:
    cmd: "curl -fsSL {{ devbox_herdr_install_url }} | sh"
    creates: "/home/{{ devbox_user }}/.local/bin/herdr"
  become_user: "{{ devbox_user }}"
  environment:
    HERDR_INSTALL_DIR: "/home/{{ devbox_user }}/.local/bin"

- name: Check existing gh authentication
  ansible.builtin.command: gh auth status
  become_user: "{{ devbox_user }}"
  register: devbox_gh_auth
  changed_when: false
  failed_when: false

- name: Authenticate gh
  ansible.builtin.command:
    cmd: gh auth login --hostname github.com --git-protocol https --with-token
    stdin: "{{ devbox_github_token }}"
  become_user: "{{ devbox_user }}"
  when: devbox_gh_auth.rc != 0
  changed_when: true
  no_log: true

# Makes gh the credential helper, which is what authenticates the HTTPS clones
# in repos.yml and every later push. Rewrites the same keys each run.
- name: Configure git to authenticate through gh
  ansible.builtin.command: gh auth setup-git
  become_user: "{{ devbox_user }}"
  changed_when: false

- name: Create the private config directory
  ansible.builtin.file:
    path: "/home/{{ devbox_user }}/.config/devbox"
    state: directory
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0700"

- name: Install the agent credential environment
  ansible.builtin.template:
    src: env.j2
    dest: "/home/{{ devbox_user }}/.config/devbox/env"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0600"
  no_log: true
