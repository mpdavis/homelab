---
- name: Create the development user
  ansible.builtin.user:
    name: "{{ devbox_user }}"
    comment: "{{ devbox_user_full_name }}"
    shell: "{{ devbox_user_shell }}"
    groups: sudo
    append: true
    create_home: true
    state: present

# Passwordless sudo: the account has no password at all (key-only login), so
# prompting would make sudo unusable rather than safer.
- name: Grant passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ devbox_user }}"
    content: "{{ devbox_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: /usr/sbin/visudo -csf %s

# Written wholesale rather than with ansible.posix.authorized_key: this repo
# depends on ansible-core's builtin modules only, and the key list is fully
# declared here anyway, so managing the file as a unit is both simpler and
# self-correcting if a key is ever added by hand.
- name: Create .ssh directory
  ansible.builtin.file:
    path: "/home/{{ devbox_user }}/.ssh"
    state: directory
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0700"

# Tofu already injects ssh_public_keys into the container for root via
# cloud-init. Reusing those rather than naming key files again keeps one source
# of truth, so a laptop key added to the Tofu variable reaches this account on
# the next run without being listed twice.
- name: Read the keys cloud-init injected for root
  ansible.builtin.slurp:
    src: /root/.ssh/authorized_keys
  register: devbox_root_keys
  when: devbox_authorized_keys | length == 0

- name: Default the user's keys to the ones Tofu injected
  ansible.builtin.set_fact:
    devbox_authorized_keys: >-
      {{ (devbox_root_keys.content | b64decode).splitlines()
         | select('match', '^(ssh|ecdsa)-') | list }}
  when: devbox_authorized_keys | length == 0

- name: Install authorized keys
  ansible.builtin.copy:
    dest: "/home/{{ devbox_user }}/.ssh/authorized_keys"
    content: "{{ devbox_authorized_keys | join('\n') }}\n"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0600"
  when: devbox_authorized_keys | length > 0

- name: Create user directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0755"
  loop:
    - "/home/{{ devbox_user }}/.local/bin"
    - "/home/{{ devbox_user }}/.config"
    - "{{ devbox_repo_root }}"

- name: Configure git identity
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "/home/{{ devbox_user }}/.gitconfig"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0644"

# Login shells of every flavour read /etc/profile (zsh via /etc/zsh/zprofile on
# Ubuntu), which makes this the one place that reaches interactive SSH sessions,
# herdr panes and the non-interactive shells agents spawn alike.
- name: Install the shared shell profile
  ansible.builtin.template:
    src: profile.sh.j2
    dest: /etc/profile.d/devbox.sh
    mode: "0644"
