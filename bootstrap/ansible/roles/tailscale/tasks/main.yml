---
- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: cloud_init_result.rc not in [0, 2]
  register: cloud_init_result

- name: Add Tailscale package signing key
  ansible.builtin.get_url:
    url: "{{ tailscale_apt_keyring_url }}"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.get_url:
    url: "{{ tailscale_apt_list_url }}"
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"
  register: tailscale_repo

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  when: tailscale_repo.changed

- name: Install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present

# Forwarding is only meaningful for a subnet router — an ordinary tailnet node
# routes nothing, so enabling it there would be cargo cult.
- name: Enable IP forwarding for subnet routing
  ansible.builtin.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-tailscale.conf
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding
  when: tailscale_advertise_routes | length > 0

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check current tailscale backend state
  ansible.builtin.command: tailscale status --json
  changed_when: false
  failed_when: false
  register: tailscale_status_raw

# tailscale up is not safely re-runnable once authenticated (re-supplying
# --auth-key on an already-running backend errors out), so this only fires on
# first bring-up. Route/hostname/SSH changes after that are applied manually
# with `tailscale set`, which is idempotent.
- name: Bring up tailscale
  ansible.builtin.command:
    argv: >-
      {{
        ['tailscale', 'up',
         '--auth-key=' ~ tailscale_auth_key,
         '--accept-dns=' ~ (tailscale_accept_dns | bool | lower),
         '--hostname=' ~ tailscale_hostname]
        + (['--advertise-routes=' ~ tailscale_advertise_routes]
           if tailscale_advertise_routes | length > 0 else [])
        + (['--advertise-tags=' ~ tailscale_advertise_tags]
           if tailscale_advertise_tags | length > 0 else [])
        + (['--ssh'] if tailscale_ssh | bool else [])
      }}
  when: "'\"BackendState\":\"Running\"' not in tailscale_status_raw.stdout"
  changed_when: true
  no_log: true
