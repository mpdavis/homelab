---
# Users added to the `docker` group. Membership is root-equivalent — the daemon
# socket will run a container that bind-mounts /, so this is a convenience for a
# single-tenant box, not a privilege boundary.
docker_users: []

# Where images and containers live. Worth overriding to an NFS-backed path only
# if the node's LVM thin pool gets tight; overlay2 on NFS is slow and loses
# hardlink semantics, so local is the right default.
docker_data_root: /var/lib/docker

# Unbounded json-file logs are the usual way a dev box silently eats its disk.
docker_log_max_size: "10m"
docker_log_max_file: "3"

docker_apt_keyring_url: https://download.docker.com/linux/ubuntu/gpg
docker_apt_repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable"
