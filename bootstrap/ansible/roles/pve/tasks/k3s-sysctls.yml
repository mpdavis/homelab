---
- name: Deploy k3s sysctl config
  ansible.builtin.template:
    src: 99-k3s.conf.j2
    dest: /etc/sysctl.d/99-k3s.conf
    owner: root
    group: root
    mode: "0644"
  notify: apply sysctls

- name: Ensure sysctls are active
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-k3s.conf
  changed_when: false
