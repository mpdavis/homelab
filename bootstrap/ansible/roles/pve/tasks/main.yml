---
- name: Configure APT repositories
  ansible.builtin.import_tasks: repositories.yml

- name: Remove subscription nag
  ansible.builtin.import_tasks: subscription-nag.yml

- name: Disable HA services
  ansible.builtin.import_tasks: disable-ha.yml

- name: Fix NIC offloading for Intel e1000e/e1000
  ansible.builtin.import_tasks: nic-offloading.yml

- name: Set k3s-required kernel sysctls
  ansible.builtin.import_tasks: k3s-sysctls.yml

- name: Update system
  ansible.builtin.import_tasks: update.yml
