---
# Provisions the always-on development host (LXC 204, 10.0.1.54) that coding
# agents run on and that herdr attaches to over SSH from a laptop or phone.
#
#   tofu -chdir=bootstrap/tofu/proxmox apply   # creates the container
#   ansible-playbook -i inventory/hosts.yml playbooks/devbox.yml
#
# The three prompts are answered from Bitwarden Secrets Manager — the same
# vault the cluster's External Secrets read. Nothing is written to the repo.

# TUN device passthrough, for the same reason and in the same way as the
# Tailscale router (see playbooks/tailscale-router.yml): tailscaled needs
# /dev/net/tun, the bpg/proxmox provider cannot grant it, and /etc/pve/lxc/*.conf
# is only writable from the node hosting the container. Re-run this playbook if
# Tofu ever destroys and recreates the container.
- name: Enable TUN device passthrough for the devbox LXC
  hosts: pve1
  become: true
  vars:
    devbox_vmid: 204
  tasks:
    - name: Ensure TUN device cgroup allow rule is present
      ansible.builtin.lineinfile:
        path: "/etc/pve/lxc/{{ devbox_vmid }}.conf"
        line: "lxc.cgroup2.devices.allow: c 10:200 rwm"
      register: tun_cgroup

    - name: Ensure /dev/net bind-mount entry is present
      ansible.builtin.lineinfile:
        path: "/etc/pve/lxc/{{ devbox_vmid }}.conf"
        line: "lxc.mount.entry: /dev/net dev/net none bind,create=dir"
      register: tun_mount

    - name: Restart the container to apply device passthrough
      ansible.builtin.command: "pct reboot {{ devbox_vmid }}"
      when: tun_cgroup.changed or tun_mount.changed
      changed_when: true

    - name: Wait for the container to come back up
      ansible.builtin.wait_for:
        host: "{{ hostvars['devbox'].ansible_host }}"
        port: 22
        delay: 5
        timeout: 120
      when: tun_cgroup.changed or tun_mount.changed
      delegate_to: localhost
      become: false

- name: Configure the development host
  hosts: development
  become: true
  vars:
    tailscale_hostname: devbox
    # Tailscale SSH terminates connections inside tailscaled and authorises
    # against the tailnet ACL, so a phone needs no key material at all. It is
    # additive: key-based sshd on the LAN/tailnet IP keeps working, which is
    # the path this playbook and herdr's own `machine add` use.
    #
    # Requires a matching `ssh` rule in the tailnet ACL — without one every
    # connection is refused. See docs/devbox.md.
    tailscale_ssh: true
  vars_prompt:
    - name: tailscale_auth_key
      prompt: "Tailscale auth key (reusable, tagged tag:devbox)"
      private: true
    - name: devbox_github_token
      prompt: "GitHub PAT (repo scope — clones and pushes for every repo on the box)"
      private: true
    - name: devbox_claude_oauth_token
      prompt: "Claude OAuth token from `claude setup-token` (blank to skip)"
      private: true
      default: ""
  roles:
    # Same LXC groundwork the k3s containers get: apparmor removed, resolv.conf
    # pinned, /dev/kmsg present, and the root mount made rshared — the last of
    # which Docker needs to start at all inside a container.
    - lxc
    # devbox before docker: the docker role adds devbox_user to the docker
    # group, and that user does not exist until devbox creates it.
    - devbox
    - role: docker
      vars:
        docker_users:
          - "{{ devbox_user }}"
    - tailscale
