---
# Provisions the always-on development host (LXC 204, 10.0.1.54). See
# docs/devbox.md for the runbook.
#
#   tofu -chdir=bootstrap/tofu/proxmox apply
#   ansible-playbook -i inventory/hosts.yml playbooks/devbox.yml

# Same out-of-band TUN passthrough as playbooks/tailscale-router.yml: the
# provider cannot grant it, and /etc/pve/lxc/*.conf is only writable from the
# hosting node. Re-run this playbook if Tofu ever recreates the container.
- name: Enable TUN device passthrough for the devbox LXC
  hosts: pve1
  become: true
  vars:
    devbox_vmid: 204
  tasks:
    - name: Ensure TUN device cgroup allow rule is present
      ansible.builtin.lineinfile:
        path: "/etc/pve/lxc/{{ devbox_vmid }}.conf"
        line: "lxc.cgroup2.devices.allow: c 10:200 rwm"
      register: tun_cgroup

    - name: Ensure /dev/net bind-mount entry is present
      ansible.builtin.lineinfile:
        path: "/etc/pve/lxc/{{ devbox_vmid }}.conf"
        line: "lxc.mount.entry: /dev/net dev/net none bind,create=dir"
      register: tun_mount

    - name: Restart the container to apply device passthrough
      ansible.builtin.command: "pct reboot {{ devbox_vmid }}"
      when: tun_cgroup.changed or tun_mount.changed
      changed_when: true

    - name: Wait for the container to come back up
      ansible.builtin.wait_for:
        host: "{{ hostvars['devbox'].ansible_host }}"
        port: 22
        delay: 5
        timeout: 120
      when: tun_cgroup.changed or tun_mount.changed
      delegate_to: localhost
      become: false

- name: Configure the development host
  hosts: development
  become: true
  vars:
    tailscale_hostname: devbox
    # Needs a matching `ssh` rule in the tailnet ACL; see docs/devbox.md.
    tailscale_ssh: true
  vars_prompt:
    - name: tailscale_auth_key
      prompt: "Tailscale auth key (reusable, tagged tag:devbox)"
      private: true
    - name: devbox_github_token
      prompt: "GitHub PAT (repo scope — clones and pushes for every repo on the box)"
      private: true
    - name: devbox_claude_oauth_token
      prompt: "Claude OAuth token from `claude setup-token` (blank to skip)"
      private: true
      default: ""
  roles:
    # lxc makes / rshared, which Docker needs to start inside a container.
    - lxc
    # devbox before docker: docker adds devbox_user to the docker group, and
    # devbox is what creates that user.
    - devbox
    - role: docker
      vars:
        docker_users:
          - "{{ devbox_user }}"
    - tailscale
