---
# Provisions the always-on development host (LXC 204). See
# docs/devbox.md for the runbook.
#
#   tofu -chdir=bootstrap/tofu/proxmox apply
#   ansible-playbook playbooks/devbox.yml

- name: Configure the development host
  hosts: development
  become: true
  vars:
    tailscale_hostname: devbox
    # Needs a matching `ssh` rule in the tailnet ACL; see docs/devbox.md.
    tailscale_ssh: true
  vars_prompt:
    - name: tailscale_auth_key
      prompt: "Tailscale auth key (reusable, tagged tag:devbox)"
      private: true
    - name: devbox_github_token
      prompt: "GitHub PAT (repo scope — clones and pushes for every repo on the box)"
      private: true
    - name: devbox_claude_oauth_token
      prompt: "Claude OAuth token from `claude setup-token` (blank to skip)"
      private: true
      default: ""
    - name: devbox_moshi_token
      prompt: "Moshi pairing token from the app, Settings -> Hooks (blank to skip)"
      private: true
      default: ""
  roles:
    # Before anything else: it reboots the container when it changes.
    - lxc_tun
    # lxc makes / rshared, which Docker needs to start inside a container.
    - lxc
    # devbox before docker: docker adds devbox_user to the docker group, and
    # devbox is what creates that user.
    - devbox
    - role: docker
      vars:
        docker_users:
          - "{{ devbox_user }}"
    - tailscale
