---
- name: Common setup
  hosts: k3s_cluster
  become: true
  roles:
    - common
  tasks:
    - name: Install k3s storage prerequisites
      ansible.builtin.apt:
        name: open-iscsi
        state: present

- name: VM-specific setup
  hosts: k3s_cluster:&vm
  become: true
  roles:
    - vm

- name: LXC-specific setup
  hosts: k3s_cluster:&lxc
  become: true
  roles:
    - lxc

- name: GPU setup
  hosts: k3s-agent-gpu
  become: true
  roles:
    - gpu

- name: Install k3s server
  hosts: k3s_server
  become: true
  roles:
    - k3s_server

- name: Join k3s agents
  hosts: k3s_agent
  become: true
  roles:
    - k3s_agent

- name: Label GPU node
  hosts: k3s_server
  become: true
  tasks:
    - name: Apply nvidia.com/gpu.present label to GPU node
      ansible.builtin.command: >
        k3s kubectl label node k3s-agent-gpu
        nvidia.com/gpu.present=true --overwrite
      changed_when: true
