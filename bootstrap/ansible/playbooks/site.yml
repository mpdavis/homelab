---
- name: Common setup
  hosts: k3s_cluster
  become: true
  roles:
    - common
  tasks:
    - name: Install k3s storage prerequisites
      ansible.builtin.apt:
        name: open-iscsi
        state: present

- name: VM-specific setup
  hosts: k3s_cluster:&vm
  become: true
  roles:
    - vm

- name: LXC-specific setup
  hosts: k3s_cluster:&lxc
  become: true
  roles:
    - lxc

- name: Install k3s server
  hosts: k3s_server
  become: true
  roles:
    - k3s_server

- name: Join k3s agents
  hosts: k3s_agent
  become: true
  roles:
    - k3s_agent
