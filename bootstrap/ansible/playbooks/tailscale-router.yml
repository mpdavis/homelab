---
- name: Configure Tailscale subnet router
  hosts: tailscale_router
  become: true
  vars:
    tailscale_hostname: tailscale-router
    tailscale_advertise_routes: "{{ network.lan_route }}"
  vars_prompt:
    - name: tailscale_auth_key
      prompt: "Enter Tailscale auth key (tagged tag:subnet-router, reusable, from Trust credentials)"
      private: true
  roles:
    - lxc_tun
    - tailscale
