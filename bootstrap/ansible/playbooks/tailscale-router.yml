---
# TUN device passthrough for the Tailscale router LXC (vmid 203). This can't be
# expressed in Tofu — the bpg/proxmox provider exposes no device-passthrough
# option for containers, and raw LXC config lines are read-only via its API.
# Runs against pve1 because that's the node the container is pinned to
# (bootstrap/tofu/proxmox/variables.tf); /etc/pve/lxc/*.conf is only writable
# from the node hosting the container. If this container is ever destroyed and
# recreated by Tofu, re-run this playbook to restore passthrough.
- name: Enable TUN device passthrough for the Tailscale router LXC
  hosts: pve1
  become: true
  vars:
    tailscale_router_vmid: 203
  tasks:
    - name: Ensure TUN device cgroup allow rule is present
      ansible.builtin.lineinfile:
        path: "/etc/pve/lxc/{{ tailscale_router_vmid }}.conf"
        line: "lxc.cgroup2.devices.allow: c 10:200 rwm"
      register: tun_cgroup

    - name: Ensure /dev/net bind-mount entry is present
      ansible.builtin.lineinfile:
        path: "/etc/pve/lxc/{{ tailscale_router_vmid }}.conf"
        line: "lxc.mount.entry: /dev/net dev/net none bind,create=dir"
      register: tun_mount

    - name: Restart the container to apply device passthrough
      ansible.builtin.command: "pct reboot {{ tailscale_router_vmid }}"
      when: tun_cgroup.changed or tun_mount.changed
      changed_when: true

    - name: Wait for the container to come back up
      ansible.builtin.wait_for:
        host: "{{ hostvars['tailscale-router'].ansible_host }}"
        port: 22
        delay: 5
        timeout: 120
      when: tun_cgroup.changed or tun_mount.changed
      delegate_to: localhost

- name: Configure Tailscale subnet router
  hosts: tailscale_router
  become: true
  vars_prompt:
    - name: tailscale_auth_key
      prompt: "Enter Tailscale auth key (tagged tag:subnet-router, reusable, from Trust credentials)"
      private: true
  roles:
    - tailscale
