---
- name: Bootstrap External Secrets access token
  hosts: k3s_server
  become: true
  vars_prompt:
    - name: bwsm_access_token
      prompt: "Enter Bitwarden Secrets Manager access token"
      private: true
  tasks:
    - name: Ensure external-secrets namespace exists
      ansible.builtin.command: k3s kubectl create namespace external-secrets --dry-run=client -o yaml
      register: ns_yaml
      changed_when: false

    - name: Apply namespace
      ansible.builtin.shell: echo '{{ ns_yaml.stdout }}' | k3s kubectl apply -f -
      changed_when: "'created' in ns_result.stdout"
      register: ns_result

    - name: Create bitwarden access token secret
      ansible.builtin.shell: |
        k3s kubectl create secret generic bitwarden-access-token \
          --namespace=external-secrets \
          --from-literal=token='{{ bwsm_access_token }}' \
          --dry-run=client -o yaml | k3s kubectl apply -f -
      changed_when: true

# Same class of problem as the ESO token above, one Flux stage over: the
# tailscale-operator chart (kubernetes/infrastructure/controllers/
# tailscale-operator.yaml) mounts a Secret named operator-oauth as a required
# (non-optional) volume. That Secret is normally created by the ExternalSecret
# in kubernetes/infrastructure/tailscale-operator/, but that lives in the
# "infrastructure" Kustomization, which only reconciles *after*
# "infrastructure-controllers" (where the HelmRelease lives) reports Ready.
# infrastructure-controllers has wait: true, so on a from-scratch bootstrap
# the operator pod would sit Pending forever waiting on a Secret that nothing
# is allowed to create yet — a permanent deadlock that also stalls every
# other ExternalSecret in "infrastructure" behind it. Pre-seeding here breaks
# the cycle the same way bitwarden-access-token does above; the ExternalSecret
# takes over managing this same Secret once infrastructure catches up.
- name: Bootstrap Tailscale operator OAuth secret
  hosts: k3s_server
  become: true
  vars_prompt:
    - name: tailscale_oauth_client_id
      prompt: "Enter Tailscale operator OAuth client ID (Trust credentials, tagged tag:k8s-operator)"
      private: true
    - name: tailscale_oauth_client_secret
      prompt: "Enter Tailscale operator OAuth client secret"
      private: true
  tasks:
    - name: Ensure tailscale namespace exists
      ansible.builtin.command: k3s kubectl create namespace tailscale --dry-run=client -o yaml
      register: ts_ns_yaml
      changed_when: false

    - name: Apply namespace
      ansible.builtin.shell: echo '{{ ts_ns_yaml.stdout }}' | k3s kubectl apply -f -
      changed_when: "'created' in ts_ns_result.stdout"
      register: ts_ns_result

    - name: Create operator-oauth secret
      ansible.builtin.shell: |
        k3s kubectl create secret generic operator-oauth \
          --namespace=tailscale \
          --from-literal=client_id='{{ tailscale_oauth_client_id }}' \
          --from-literal=client_secret='{{ tailscale_oauth_client_secret }}' \
          --dry-run=client -o yaml | k3s kubectl apply -f -
      changed_when: true
      no_log: true
