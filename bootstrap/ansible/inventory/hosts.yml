all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
  children:
    k3s_server:
      hosts:
        k3s-server:
          ansible_host: 10.0.1.50
          node_type: lxc
    k3s_agent:
      hosts:
        k3s-agent-1:
          ansible_host: 10.0.1.51
          node_type: lxc
        k3s-agent-gpu:
          ansible_host: 10.0.1.52
          node_type: vm
    k3s_cluster:
      children:
        k3s_server:
        k3s_agent:
      vars:
        k3s_server_ip: 10.0.1.50
    pve:
      hosts:
        pve1:
          ansible_host: 10.0.1.1
        pve2:
          ansible_host: 10.0.1.2
      vars:
        ansible_user: root
    tailscale_router:
      hosts:
        tailscale-router:
          ansible_host: 10.0.1.53
          node_type: lxc
    development:
      hosts:
        devbox:
          ansible_host: 10.0.1.54
          node_type: lxc
    docker_hosts:
      hosts:
        docker:
          ansible_host: 10.0.1.55
          node_type: vm
          # Caddy binds one of these per exposure: .56 public (the router's
          # 443 forward moves here at cutover), .57 tailnet (never forwarded).
          # Outside METALLB_POOL so they can't collide during the migration.
          service_ips:
            - 10.0.1.56/16
            - 10.0.1.57/16
          docker_networks:
            - proxy
        infra:
          ansible_host: 10.0.1.58
          node_type: vm
          # Selects doco-cd/.doco-cd.infra.yaml, so this host deploys infra/
          # rather than stacks/. Caddy binds the host IP directly — one
          # exposure here, so it needs no extra service IPs.
          doco_cd_target: infra
          docker_networks:
            - proxy
