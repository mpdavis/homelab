all:
  children:
    pve:
      hosts:
        pve1:
        pve2:

    # --- Guests, by what they do. VMIDs and sizing live in bootstrap/tofu/proxmox.

    k3s_cluster:
      children:
        k3s_server:
          hosts:
            k3s-server:
        k3s_agent:
          hosts:
            k3s-agent-1:
            k3s-agent-gpu:
      vars:
        k3s_server_ip: "{{ hostvars[groups['k3s_server'][0]].ansible_host }}"

    docker_hosts:
      hosts:
        docker:
          # Caddy binds one of these per exposure: public (the router's 443
          # forward target) and tailnet (never forwarded).
          service_ips:
            - "{{ network.service_ips.compose_public }}/{{ network.prefix }}"
            - "{{ network.service_ips.compose_tailnet }}/{{ network.prefix }}"
          docker_networks:
            - proxy
        infra:
          # Selects doco-cd/.doco-cd.infra.yaml, so this host deploys infra/
          # rather than stacks/. Caddy binds the host IP directly — one
          # exposure here, so it needs no extra service IPs.
          doco_cd_target: infra
          docker_networks:
            - proxy

    tailscale_router:
      hosts:
        tailscale-router:
    development:
      hosts:
        devbox:

    # --- Guests, by how Tofu creates them (containers vs vms).

    lxc:
      hosts:
        k3s-server:
        k3s-agent-1:
        tailscale-router:
        devbox:
      vars:
        node_type: lxc
    vm:
      hosts:
        k3s-agent-gpu:
        docker:
        infra:
      vars:
        node_type: vm
