all:
  children:
    k3s_server:
      hosts:
        k3s-server:
          node_type: lxc
    k3s_agent:
      hosts:
        k3s-agent-1:
          node_type: lxc
        k3s-agent-gpu:
          node_type: vm
    k3s_cluster:
      children:
        k3s_server:
        k3s_agent:
      vars:
        k3s_server_ip: "{{ hostvars[groups['k3s_server'][0]].ansible_host }}"
    pve:
      hosts:
        pve1:
        pve2:
      vars:
        ansible_user: root
    tailscale_router:
      hosts:
        tailscale-router:
          node_type: lxc
    development:
      hosts:
        devbox:
          node_type: lxc
    docker_hosts:
      hosts:
        docker:
          node_type: vm
          # Caddy binds one of these per exposure: public (the router's 443
          # forward target) and tailnet (never forwarded).
          service_ips:
            - "{{ network.service_ips.compose_public }}/{{ network.prefix }}"
            - "{{ network.service_ips.compose_tailnet }}/{{ network.prefix }}"
          docker_networks:
            - proxy
        infra:
          node_type: vm
          # Selects doco-cd/.doco-cd.infra.yaml, so this host deploys infra/
          # rather than stacks/. Caddy binds the host IP directly — one
          # exposure here, so it needs no extra service IPs.
          doco_cd_target: infra
          docker_networks:
            - proxy
