apiVersion: apps/v1
kind: Deployment
metadata:
  name: emby
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: emby
  template:
    metadata:
      labels:
        app: emby
    spec:
      runtimeClassName: nvidia
      containers:
        - name: emby
          image: emby/embyserver:latest
          ports:
            - containerPort: 8096
              name: http
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: all
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: emby-config
        - name: media
          nfs:
            server: 10.0.1.6
            path: /var/nfs/shared/data/media
