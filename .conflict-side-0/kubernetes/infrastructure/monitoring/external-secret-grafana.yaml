apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: grafana-admin
  data:
    - secretKey: admin-user
      remoteRef:
        key: ${BWS_GRAFANA_ADMIN_USER}
    - secretKey: admin-password
      remoteRef:
        key: ${BWS_GRAFANA_ADMIN_PASSWORD}
