apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: paperless-secrets
  data:
    - secretKey: secret-key
      remoteRef:
        key: ${BWS_PAPERLESS_SECRET_KEY}
    - secretKey: admin-user
      remoteRef:
        key: ${BWS_PAPERLESS_ADMIN_USER}
    - secretKey: admin-password
      remoteRef:
        key: ${BWS_PAPERLESS_ADMIN_PASSWORD}
    # OAuth2 client secret for Authentik OIDC login (same BWS secret the
    # authentik provider blueprint reads).
    - secretKey: oidc-client-secret
      remoteRef:
        key: ${BWS_PAPERLESS_OIDC_CLIENT_SECRET}
