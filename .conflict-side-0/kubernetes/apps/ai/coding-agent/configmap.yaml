# opencode config, mounted into the main container and loaded via
# OPENCODE_CONFIG (helmrelease.yaml). opencode merges this between the global
# config (~/.config/opencode/opencode.json on the PVC) and any project config —
# only the keys set here override. Points the anthropic provider at the
# Meridian sidecar (loopback:3456), which bridges requests onto the Claude
# subscription; the apiKey is a required placeholder that Meridian ignores.
# opencode re-reads config per run, so changes here apply to new sessions
# without a pod restart once Flux syncs the ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coding-agent-opencode
data:
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "provider": {
        "anthropic": {
          "options": {
            "baseURL": "http://127.0.0.1:3456",
            "apiKey": "dummy"
          }
        }
      }
    }
