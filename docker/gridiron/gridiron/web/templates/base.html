<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Gridiron</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fbfaf8;
      --panel: #ffffff;
      --ink: #1b1a17;
      --muted: #6d6a63;
      --line: #e4e0d8;
      --accent: #8a5a2b;
      --good: #17694a;
      --bad: #9d2a2a;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171614;
        --panel: #201e1b;
        --ink: #ece8e1;
        --muted: #9a9689;
        --line: #322f2a;
        --accent: #d09a5e;
        --good: #5cc79a;
        --bad: #e0736f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    header {
      border-bottom: 1px solid var(--line); background: var(--panel);
      position: sticky; top: 0; z-index: 5;
    }
    nav {
      max-width: 1180px; margin: 0 auto; padding: 0 20px;
      display: flex; align-items: baseline; gap: 22px; flex-wrap: wrap;
    }
    nav .brand {
      font-weight: 650; letter-spacing: -0.01em; padding: 14px 0;
      margin-right: 4px;
    }
    nav .brand span { color: var(--accent); }
    nav a {
      color: var(--muted); text-decoration: none; padding: 14px 0;
      border-bottom: 2px solid transparent; font-size: 14px;
    }
    nav a:hover { color: var(--ink); }
    nav a.active { color: var(--ink); border-bottom-color: var(--accent); }
    main { max-width: 1180px; margin: 0 auto; padding: 28px 20px 64px; }
    h1 { font-size: 24px; letter-spacing: -0.02em; margin: 0 0 6px; }
    h2 { font-size: 17px; letter-spacing: -0.01em; margin: 30px 0 10px; }
    .lede { color: var(--muted); margin: 0 0 24px; max-width: 68ch; }
    .panel {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; padding: 18px 20px; margin-bottom: 20px;
    }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
    th, td {
      text-align: left; padding: 7px 12px 7px 0;
      border-bottom: 1px solid var(--line); white-space: nowrap;
    }
    th { color: var(--muted); font-weight: 550; font-size: 12px;
         text-transform: uppercase; letter-spacing: 0.04em; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums;
                     font-family: var(--mono); }
    tr:last-child td { border-bottom: none; }
    .good { color: var(--good); }
    .bad { color: var(--bad); }
    .muted { color: var(--muted); }
    .note {
      border-left: 3px solid var(--accent); padding: 2px 0 2px 14px;
      color: var(--muted); margin: 12px 0; max-width: 74ch;
    }
    .kv { display: flex; flex-wrap: wrap; gap: 8px 30px; margin: 0; }
    .kv div { min-width: 120px; }
    .kv dt { color: var(--muted); font-size: 12px; text-transform: uppercase;
             letter-spacing: 0.04em; }
    .kv dd { margin: 2px 0 0; font-family: var(--mono); font-size: 17px; }
    form.controls { display: flex; gap: 14px; align-items: flex-end;
                    flex-wrap: wrap; margin-bottom: 18px; }
    form.controls label { font-size: 12px; color: var(--muted);
                          text-transform: uppercase; letter-spacing: 0.04em; }
    form.controls input {
      display: block; margin-top: 4px; width: 110px; padding: 6px 8px;
      border: 1px solid var(--line); border-radius: 6px;
      background: var(--panel); color: var(--ink); font-family: var(--mono);
    }
    form.controls button {
      padding: 7px 16px; border: 1px solid var(--accent); border-radius: 6px;
      background: var(--accent); color: #fff; cursor: pointer; font-size: 14px;
    }
    .empty { color: var(--muted); padding: 26px 0; }
    code { font-family: var(--mono); font-size: 0.92em;
           background: var(--bg); padding: 1px 5px; border-radius: 4px; }
    .pill { font-size: 11px; padding: 2px 8px; border-radius: 20px;
            border: 1px solid var(--line); color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="brand">grid<span>iron</span></div>
      <a href="/" class="{{ 'active' if title == 'Edges' }}">Edges</a>
      <a href="/theories" class="{{ 'active' if title == 'Theories' }}">Theories</a>
      <a href="/backtests" class="{{ 'active' if title == 'Backtests' }}">Backtests</a>
      <a href="/status" class="{{ 'active' if title == 'Status' }}">Status</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
