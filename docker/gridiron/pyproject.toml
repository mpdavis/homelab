[project]
name = "gridiron"
version = "1.0.0"
description = "College football betting research — theory backtesting and line-vs-model edge finding"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    # The whole store. Play-by-play for a decade is ~10M rows; an embedded
    # columnar engine makes the group-bys that build features interactive
    # rather than a job you wait on. See db.py for why it is not Postgres.
    "duckdb>=1.1,<2",
    "pandas>=2.2,<3",
    # Ridge solves go through numpy's least squares — no scikit-learn, which
    # would roughly triple the image for one linear-algebra call.
    "numpy>=1.26,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "jinja2>=3.1,<4",
    # Kickoff cutoffs are compared in a named zone, and slim base images do not
    # reliably ship the system zoneinfo database.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# httpx2 is what starlette's TestClient wants; with plain httpx it emits a
# deprecation warning, and warnings are errors here. Test-only — the package
# itself talks to CFBD and The Odds API over httpx.
dev = ["pytest>=8,<10", "httpx2>=2,<3"]

[project.scripts]
gridiron = "gridiron.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gridiron*"]

[tool.setuptools.package-data]
"gridiron.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]
filterwarnings = ["error"]
