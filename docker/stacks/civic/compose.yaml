name: civic

services:
  # Polls the city's document server for new agendas, packets and minutes, and
  # writes each meeting's page to the shared volume. A run with nothing new
  # costs nine folder listings and no model calls; a new meeting costs ~$1.40.
  #
  # Replaces a ten-minute CronJob. Sleeping after each run, not on a fixed
  # schedule, keeps a slow cold run (~15 minutes) from overlapping the next one,
  # which would race on the state file.
  ames-council-digest:
    # Published from mpdavis/ames-council-digest's main branch only. Tags below
    # 1.0.28 predate that and may be unreviewed branch builds.
    image: ghcr.io/mpdavis/ames-council-digest:1.0.49
    restart: unless-stopped
    user: "1000:1000"
    # A shell loop as PID 1 ignores SIGTERM; tini passes it on.
    init: true
    entrypoint: ["/bin/sh", "-c"]
    # timeout bounds a wedged gateway. The marker file is what the healthcheck
    # reads, so repeated failures show as unhealthy rather than only in the log.
    command:
      - |
        while :; do
          timeout 1800 ames-digest run && touch /tmp/last-success
          sleep 600
        done
    environment:
      TZ: America/Chicago
      # Pages land on the volume as Markdown and HTML for the web service. Add
      # ntfy or smtp once a destination is settled on.
      AMES_DELIVERY: file
      AMES_LLM_BASE_URL: https://opencode.ai/zen/v1
      AMES_LLM_API_KEY: ${AMES_LLM_API_KEY:?resolved by doco-cd from external_secrets}
      # Per-item summaries are the bulk of the tokens; the single digest call is
      # where quality shows, so it gets the better model.
      AMES_ITEM_MODEL: claude-sonnet-4-5
      AMES_DIGEST_MODEL: claude-sonnet-4-5
      AMES_STATE_DIR: /data/state
      AMES_OUTPUT_DIR: /data/digests
    volumes:
      - data:/data
    read_only: true
    # PDF buffering.
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 1
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/last-success -mmin -90 | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 1
      # Long enough for a cold first run.
      start_period: 30m

  # A plain file server over the pages the digest job writes. Read-only, so
  # nothing here can cost a digest.
  council:
    image: nginxinc/nginx-unprivileged:1.31-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # The volume root, with nginx serving only digests/, so state/ is never
      # in the served tree.
      - data:/srv:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - proxy

volumes:
  # State (which meetings are digested) and the rendered pages. Losing the
  # state means paying to re-summarize meetings, so it stays on the NAS. The
  # NAS offers NFSv3 only, and maps every writer to its own uid.
  data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=10.0.1.6,nfsvers=3,rw,hard,proto=tcp
      device: ":/var/nfs/shared/homelab/ames-council-digest"

networks:
  proxy:
    external: true
