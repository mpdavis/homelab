server {
    listen 8080;
    server_name _;
    charset utf-8;

    root /srv/digests;
    # The digest job regenerates index.html on every run, so autoindex stays
    # off and a missing index reads as a 404 rather than a file listing.
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # nginx's default type for .md prompts a download instead.
    location ~ \.md$ {
        default_type text/plain;
        charset utf-8;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
