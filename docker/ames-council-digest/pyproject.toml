[project]
name = "ames-council-digest"
version = "1.0.0"
description = "Fetch Ames City Council agendas and packets, summarize them, and emit a digest"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pypdf>=5,<7",
    "markdown>=3.5,<4",
]

[project.scripts]
ames-digest = "ames_digest.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ames_digest*"]
