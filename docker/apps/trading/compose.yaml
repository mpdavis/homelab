name: trading

# trader and trading-dashboard run ghcr.io/mpdavis/algo-trading (source in
# mpdavis/algo-trading), against the Alpaca paper account. Strategies keep their
# state in the shared volume, one directory each; the dashboard only reads it.
#
# The kalshi-* services run ghcr.io/mpdavis/kalshi-trader (source in
# mpdavis/kalshi-trader) against the Kalshi production API. kalshi-live places
# real orders (tagged `lip-`; it never touches orders placed by hand). The
# recorder only reads market data, and the control plane's one write is its
# kill switch. The shadow engine (`kalshi-trader run` without --live) is
# paused; it last ran here as kalshi-shadow, see #1061 to bring it back.
x-alpaca: &alpaca
  TZ: America/Chicago
  ALPACA_API_KEY: ${ALPACA_PAPER_API_KEY:?resolved by doco-cd from external_secrets}
  ALPACA_API_SECRET: ${ALPACA_PAPER_API_SECRET:?resolved by doco-cd from external_secrets}
  ALPACA_IS_PAPER: "true"
  STRATEGIES: pairs,orb,selloff

x-kalshi: &kalshi
  TZ: America/Chicago
  KALSHI_ENV: prod
  KALSHI_API_KEY_ID: ${KALSHI_API_KEY_ID:?resolved by doco-cd from external_secrets}
  KALSHI_PRIVATE_KEY: ${KALSHI_PRIVATE_KEY:?resolved by doco-cd from external_secrets}

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # Runs every strategy in STRATEGIES under one LumiBot trader. They share the
  # account, so no two may trade the same symbol; `live` refuses to start if
  # they do. Listed rather than left to the default (every strategy), so an
  # image bump never starts trading a new strategy unasked.
  trader:
    <<: *hardening
    image: ghcr.io/mpdavis/algo-trading:1.0.21
    restart: unless-stopped
    init: true
    command: ["live"]
    environment:
      <<: *alpaca
      # The two pairs that passed Engle-Granger on Oct 2025 – Oct 2026 closes.
      PAIRS_PAIRS: JBHT/KNX,UPS/ODFL
    volumes:
      - state:/data
    # LumiBot's logs and market-data cache. Bounded, so a runaway cache fails
    # the container instead of eating host memory.
    tmpfs:
      - /tmp:size=512m
    cpus: 1
    mem_limit: 2g
    healthcheck:
      # Each strategy's heartbeat advances on every completed iteration, which
      # only happens in market hours; the default 96h covers a holiday weekend.
      test: ["CMD", "algo-trading", "healthcheck"]
      interval: 15m
      timeout: 30s
      retries: 1
      start_period: 2m

  # Read-only view of the account and each strategy's state, behind Authentik
  # at trading.mpdavis.com.
  trading-dashboard:
    <<: *hardening
    image: ghcr.io/mpdavis/algo-trading:1.0.21
    restart: unless-stopped
    init: true
    command: ["dashboard"]
    environment:
      <<: *alpaca
    volumes:
      - state:/data:ro
    tmpfs:
      - /tmp:size=64m
    cpus: 0.5
    mem_limit: 512m
    healthcheck:
      # The slim image has no curl or wget.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - default
      - proxy

  # Order books and trades of the 300 most promising quiet incentive programs,
  # re-scanned hourly. Writes only changes, so quiet books cost almost nothing.
  kalshi-recorder:
    <<: *hardening
    image: ghcr.io/mpdavis/kalshi-trader:1.0.14
    restart: unless-stopped
    init: true
    command:
      - record
      - --top=300
      - --max-volume=100
      - --max-books=1500
      - --db=/data/lip.sqlite
    environment:
      <<: *kalshi
    volumes:
      - kalshi:/data
    tmpfs:
      - /tmp:size=64m
    cpus: 1
    mem_limit: 1g
    # The first heartbeat comes after the startup scan of ~1,500 order books
    # (2-3 min), hence the long start_period and the timeout in .doco-cd.yml.
    healthcheck:
      test: ["CMD", "kalshi-trader", "health", "--db", "/data/lip.sqlite"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5m

  # REAL ORDERS. Quotes the top 50 quiet LIP programs with resting bids capped
  # at half the cash balance read at startup, less fills since. On a kill-switch trip it writes /data/live.sqlite.halted
  # and exits 0, so `on-failure` leaves it down: review, delete the halt file,
  # then start it again. Stopping it (SIGTERM) cancels every resting bot order.
  kalshi-live:
    <<: *hardening
    image: ghcr.io/mpdavis/kalshi-trader:1.0.14
    restart: on-failure:5
    init: true
    stop_grace_period: 30s
    command:
      - run
      - --live
      - --top=50
      - --max-volume=100
      - --max-books=800
      - --size=100
      - --max-price=0.15
      - --max-market-collateral=5
      - --max-cash-fraction=0.5
      - --max-daily-fill-cost=5
      - --db=/data/live.sqlite
    environment:
      <<: *kalshi
    volumes:
      - kalshi:/data
    tmpfs:
      - /tmp:size=64m
    cpus: 1
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "kalshi-trader", "health", "--db", "/data/live.sqlite"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5m

  # Control plane at kalshi.mpdavis.com, behind Authentik. Reads the other two
  # services' databases; its kill switch writes /data/live.sqlite.halted and
  # cancels resting bot orders, which is why it mounts the volume read-write.
  kalshi-ui:
    <<: *hardening
    image: ghcr.io/mpdavis/kalshi-trader:1.0.14
    restart: unless-stopped
    init: true
    command:
      - ui
      - --host=0.0.0.0
      - --port=8080
      - --data-dir=/data
    environment:
      <<: *kalshi
    volumes:
      - kalshi:/data
    tmpfs:
      - /tmp:size=64m
    cpus: 0.5
    mem_limit: 512m
    healthcheck:
      # The slim image has no curl or wget.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - default
      - proxy

volumes:
  # One directory per strategy (state and heartbeat). Losing it is recoverable:
  # pairs and selloff re-adopt open positions from the account, and orb closes
  # any SPY position that is not today's trade.
  # Not `data`: QuantDinger's old trading_data volume still holds its files.
  state:
  # SQLite databases for the recorder (lip.sqlite), the paused shadow engine
  # (shadow.sqlite, history only) and live engine (live.sqlite, plus live.sqlite.halted after
  # a kill-switch trip). Losing it loses research history only; nothing in it is
  # needed to trade.
  kalshi:

networks:
  proxy:
    external: true
