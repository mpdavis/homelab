name: trading

# Both services run ghcr.io/mpdavis/algo-trading (source in mpdavis/algo-trading),
# against the Alpaca paper account. Strategies keep their state in the shared
# volume, one directory each; the dashboard only reads it. Bots are enabled and
# halted through files in the control volume, which both services write.
x-common: &common
  TZ: America/Chicago
  STRATEGIES: pairs,orb,selloff
  CONTROL_DIR: /control

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # Runs every strategy in STRATEGIES under one LumiBot trader. They share the
  # account, so no two may trade the same symbol; `live` refuses to start if
  # they do. Listed rather than left to the default (every strategy), so an
  # image bump never starts trading a new strategy unasked.
  trader:
    <<: *hardening
    image: ghcr.io/mpdavis/algo-trading:1.0.21
    restart: unless-stopped
    init: true
    command: ["live"]
    environment:
      <<: *common
      ALPACA_API_KEY: ${ALPACA_PAPER_API_KEY:?resolved by doco-cd from external_secrets}
      ALPACA_API_SECRET: ${ALPACA_PAPER_API_SECRET:?resolved by doco-cd from external_secrets}
      ALPACA_IS_PAPER: "true"
      # The two pairs that passed Engle-Granger on Oct 2025 – Oct 2026 closes.
      PAIRS_PAIRS: JBHT/KNX,UPS/ODFL
    volumes:
      - state:/data
      - control:/control
    # LumiBot's logs and market-data cache. Bounded, so a runaway cache fails
    # the container instead of eating host memory.
    tmpfs:
      - /tmp:size=512m
    cpus: 1
    mem_limit: 2g
    # Shutdown waits out the current reconciliation cycle and any close in
    # flight. A kill at Docker's default 10s leaves a fresh heartbeat, and the
    # next start refuses to run for 2 minutes.
    stop_grace_period: 60s
    healthcheck:
      # Each strategy's heartbeat advances on every completed iteration, which
      # only happens in market hours; the default 96h covers a holiday weekend.
      test: ["CMD", "algo-trading", "healthcheck"]
      interval: 15m
      timeout: 30s
      retries: 1
      start_period: 2m

  # The account and each bot's state, plus enable/halt controls, behind
  # Authentik at trading.mpdavis.com. No port is published, so Authentik stays
  # the only way in: the app itself lets anyone read and guards its controls
  # with nothing but the token. It must not hold the Alpaca keys; it disables
  # every control if it finds them.
  trading-dashboard:
    <<: *hardening
    image: ghcr.io/mpdavis/algo-trading:1.0.21
    restart: unless-stopped
    init: true
    command: ["dashboard"]
    environment:
      <<: *common
      # Without it the dashboard is read-only.
      DASHBOARD_TOKEN: ${TRADING_DASHBOARD_TOKEN:?resolved by doco-cd from external_secrets}
      DASHBOARD_HTTPS: "true"
      DASHBOARD_TRUST_PROXY: "true"
    volumes:
      - state:/data:ro
      - control:/control
    tmpfs:
      - /tmp:size=64m
    cpus: 0.5
    mem_limit: 512m
    healthcheck:
      # The slim image has no curl or wget.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - default
      - proxy

volumes:
  # One directory per strategy (state and heartbeat). Losing it is recoverable:
  # pairs and selloff re-adopt open positions from the account, and orb closes
  # any SPY position that is not today's trade.
  # Not `data`: QuantDinger's old trading_data volume still holds its files.
  state:
  # Enable/halt flags, the paper/live marker live writes, and the dashboard's
  # generated cookie-signing key (.secret).
  control:

networks:
  proxy:
    external: true
