name: trading

services:
  # Market-neutral pairs trading on the Alpaca paper account, run by LumiBot:
  # long the cheap leg, short the rich one. Source and rules are in
  # mpdavis/pairs-trader. It trades once a day at the open and serves nothing,
  # so there is no Caddy site or Gatus check; the heartbeat healthcheck is the
  # signal that it is still iterating.
  pairs-trader:
    image: ghcr.io/mpdavis/pairs-trader:1.0.1
    restart: unless-stopped
    init: true
    environment:
      TZ: America/Chicago
      ALPACA_API_KEY: ${ALPACA_PAPER_API_KEY:?resolved by doco-cd from external_secrets}
      ALPACA_API_SECRET: ${ALPACA_PAPER_API_SECRET:?resolved by doco-cd from external_secrets}
      ALPACA_IS_PAPER: "true"
      # The two pairs that passed Engle-Granger on Oct 2025 – Oct 2026 closes.
      # A symbol must not also be traded by anything else in this account.
      PAIRS: JBHT/KNX,UPS/ODFL
    volumes:
      - state:/data
    read_only: true
    # LumiBot's logs and market-data cache. Bounded, so a runaway cache fails
    # the container instead of eating host memory.
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 1
    mem_limit: 2g
    healthcheck:
      # Touched on every iteration, which only happens in market hours; four
      # days covers a holiday weekend.
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -5760 | grep -q ."]
      interval: 15m
      timeout: 10s
      retries: 1
      start_period: 96h

volumes:
  # Each pair's entry day and cooldown, and the last session traded. Losing it
  # is recoverable: open pairs are re-adopted from the account's positions.
  # Not `data`: QuantDinger's old trading_data volume still holds its files.
  state:
