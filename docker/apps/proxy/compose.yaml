name: proxy

# One Caddy per exposure, each publishing only on its own IP, so exposure is
# decided by which Caddyfile a site is in.
services:
  caddy-tailnet:
    image: ghcr.io/mpdavis/caddy-cloudflare:latest@sha256:9af4262483b1a716ce832ed0e6c9327d31915010dd0240ce1bbe08345f1c76e8
    restart: unless-stopped
    ports:
      - 10.0.1.57:80:80
      - 10.0.1.57:443:443
      - 10.0.1.57:443:443/udp
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?resolved by doco-cd from external_secrets}
    volumes:
      - ./Caddyfile.tailnet:/etc/caddy/Caddyfile:ro
      - ./authentik.caddy:/etc/caddy/authentik.caddy:ro
      - caddy-tailnet-data:/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy-public:
    image: ghcr.io/mpdavis/caddy-cloudflare:latest@sha256:9af4262483b1a716ce832ed0e6c9327d31915010dd0240ce1bbe08345f1c76e8
    restart: unless-stopped
    ports:
      - 10.0.1.56:80:80
      - 10.0.1.56:443:443
      - 10.0.1.56:443:443/udp
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?resolved by doco-cd from external_secrets}
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY:?resolved by doco-cd from external_secrets}
    volumes:
      - ./Caddyfile.public:/etc/caddy/Caddyfile:ro
      - ./authentik.caddy:/etc/caddy/authentik.caddy:ro
      - caddy-public-data:/data
      - caddy-public-logs:/var/log/caddy
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Reads caddy-public's access log and bans IPs that trip its scenarios;
  # caddy-public enforces the bans. Only the public Caddy is watched: everything
  # reaching the tailnet one is already ours.
  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1
    restart: unless-stopped
    labels:
      # For the CrowdSec dashboard in tofu/grafana; Alloy keeps only the
      # cs_* series it plots.
      homelab.metrics.port: "6060"
    environment:
      COLLECTIONS: crowdsecurity/caddy crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      # Registers the key under the name "caddy" on every start, so the
      # bouncer survives a lost crowdsec-config volume.
      BOUNCER_KEY_caddy: ${CROWDSEC_BOUNCER_KEY:?resolved by doco-cd from external_secrets}
    volumes:
      # A file, not the acquis.d directory: on first start the entrypoint
      # chowns /etc/crowdsec, and a read-only directory mount there aborts it.
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.d/caddy.yaml:ro
      - ./crowdsec/appsec.yaml:/etc/crowdsec/acquis.d/appsec.yaml:ro
      # Credentials, CAPI registration and installed hub items.
      - crowdsec-config:/etc/crowdsec
      # The SQLite database of alerts and decisions.
      - crowdsec-data:/var/lib/crowdsec/data
      - caddy-public-logs:/var/log/caddy:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  # Holds issued certificates and the ACME account. Losing it only costs a
  # re-issue, but repeated loss runs into Let's Encrypt rate limits.
  caddy-tailnet-data:
  caddy-public-data:
  caddy-public-logs:
  crowdsec-config:
  crowdsec-data:

networks:
  proxy:
    external: true
