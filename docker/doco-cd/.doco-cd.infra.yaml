# The infra host's deploy config (poll target `infra`); .doco-cd.yaml is the
# compose host's.
name: doco-cd
working_dir: docker/doco-cd
compose_files: [compose.yaml]
# Keeps this host polling its own target after doco-cd redeploys itself.
environment:
  DOCO_TARGET: infra

---
working_dir: docker/infra
auto_discovery:
  enabled: true
  depth: 1
  delete: true
