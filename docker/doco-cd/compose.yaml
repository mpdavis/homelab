# The doco-cd instance on each host. doco-cd deploys this stack itself (the
# `doco-cd` deployment in each host's deploy config), so a Renovate bump is a
# merge like any other. The doco_cd Ansible role only starts the first
# instance on a host; see docs/compose.md.
#
# Self-update hands over to a second container (scale_out); container_name or
# published ports would force it to stop-and-replace instead.
name: doco-cd

services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.125.0
    restart: unless-stopped
    environment:
      TZ: America/Chicago
      # Keeps the deploy configs in docker/doco-cd/ instead of the repo root.
      DEPLOY_CONFIG_BASE_DIR: docker/doco-cd
      SELF_UPDATE_ENABLED: "true"
      POLL_CONFIG: |
        - url: https://github.com/mpdavis/homelab.git
          reference: main
          interval: 60s
          # Empty on the compose host (the default .doco-cd.yaml); the infra
          # host sets it to select .doco-cd.infra.yaml.
          target: ${DOCO_TARGET:-}
      SECRET_PROVIDER: bitwarden_sm
      SECRET_PROVIDER_ACCESS_TOKEN_FILE: /run/secrets/bws-access-token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/homelab/bws-access-token:/run/secrets/bws-access-token:ro
      - data:/data
    cap_drop:
      - ALL
    # Same check as the image's; self-update gates the handover on it, and
    # falls back to a slower exec probe when the service declares none.
    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  # External so a self-update can never recreate it: it holds the clone and
  # the handover journal. The Ansible role creates it.
  data:
    name: doco-cd_data
    external: true
