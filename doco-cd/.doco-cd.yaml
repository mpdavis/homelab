# doco-cd itself. name and the service must match the running container's
# compose project and service, or it deploys a second doco-cd beside itself.
name: doco-cd
working_dir: doco-cd
compose_files: [compose.yaml]

---
# Every directory under stacks/ is one compose project. A stack's own
# .doco-cd.yml (e.g. its external_secrets) is merged over this.
working_dir: stacks
auto_discovery:
  enabled: true
  depth: 1
  # Deleting a stack's directory removes the project; its volumes are kept
  # (remove_volumes defaults to false).
  delete: true
