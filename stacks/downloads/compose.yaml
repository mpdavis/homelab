name: downloads

services:
  podfetch:
    image: samuel19982/podfetch:v5.2.3
    restart: unless-stopped
    # Matches the uid/gid the k3s pod ran as, so it keeps write access to the
    # files it already owns on the NFS share.
    user: "1000:1000"
    environment:
      TZ: America/Chicago
      POLLING_INTERVAL: "60"
      DATABASE_URL: sqlite:///app/db/podcast.db
    volumes:
      - podfetch-db:/app/db
      - podcasts:/app/podcasts
    networks:
      - proxy

volumes:
  # SQLite database and app config.
  podfetch-db:
  # Downloaded episodes live on the media share so AudiobookShelf serves the
  # same library. The NAS offers NFSv3 only.
  podcasts:
    driver: local
    driver_opts:
      type: nfs
      o: addr=10.0.1.6,nfsvers=3,rw,hard,proto=tcp
      device: ":/var/nfs/shared/data/media/podcasts"

networks:
  proxy:
    external: true
