name: Build Gridiron Image

# Builds docker/gridiron into ghcr.io/mpdavis/gridiron.
#
# The package's unit tests are NOT here — they are a required check, and a
# required check cannot live behind this workflow's `paths` filter. See
# gridiron-tests.yml. Nothing reaches main with a red suite, so the image this
# publishes is built from tested code by construction.
# Tags are semver (1.0.<run_number>) so the Deployment pins a real tag
# (image-pin-check) and Renovate's kubernetes manager can open bump PRs — the
# image is never referenced as :latest.
#
# ONLY main PUBLISHES, for the same reason as build-ames-council-digest.yml:
# Renovate picks bumps by reading the registry's tag list, which carries no
# provenance, so any tag this workflow pushes is a tag the cluster can end up
# running. Publishing only from main makes "newest tag" and "newest reviewed
# code" the same thing.
#
# Pull requests still build (never push) so a broken Dockerfile fails the PR
# rather than main. The `paths` filter keeps merges that don't touch the image
# from publishing a tag whose contents are identical to the last one.
#
# THE TRADEOFF: a PR can no longer change the image and bump the pin at once —
# image-pin-check would resolve a tag that does not exist yet. Merge the image
# change, let main publish, then bump the pin in a second PR (Renovate opens it
# unprompted, usually within the hour).

on:
  push:
    branches: [main]
    paths:
      - 'docker/gridiron/**'
  pull_request:
    paths:
      - 'docker/gridiron/**'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-gridiron-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The single gate on publishing. Covers workflow_dispatch too: dispatching
      # this from a branch builds it without pushing, same as a PR.
      PUSH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: docker/gridiron
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ghcr.io/mpdavis/gridiron:1.0.${{ github.run_number }}
            ghcr.io/mpdavis/gridiron:latest

      - name: Print image tag
        run: |
          if [ "$PUSH" = "true" ]; then
            echo "Published ghcr.io/mpdavis/gridiron:1.0.${{ github.run_number }}"
          else
            echo "Built only — ${GITHUB_REF} does not publish. Merge to main to push a tag."
          fi
