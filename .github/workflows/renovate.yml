name: Renovate

# Self-hosted Renovate runner. Renovate scans the repo on a schedule and opens
# PRs that bump dependencies it manages (Flux HelmRelease chart versions,
# container image tags, GitHub Actions). Configuration lives in renovate.json.
on:
  schedule:
    # Nightly at 04:00 UTC. Renovate's own rate limits / schedules in
    # renovate.json still apply on top of this.
    - cron: "0 4 * * *"
  # Allow manual runs from the Actions tab (handy for the first run / testing).
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level"
        required: false
        default: "info"
        type: choice
        options:
          - debug
          - info
          - warn

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.15
        with:
          # PAT with repo + workflow scope (classic) or equivalent fine-grained
          # permissions. Stored as the RENOVATE_TOKEN repository secret. A PAT
          # (rather than GITHUB_TOKEN) is required so PRs Renovate opens can
          # trigger other workflows.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          # Restrict Renovate to this repository.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
