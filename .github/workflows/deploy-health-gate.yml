name: Deploy Health Gate

# Blocks a PR from merging until the CURRENT `main` (i.e. the previously merged PR)
# has been reconciled by Flux and is healthy. Combined with the branch ruleset's
# "require branches up to date before merging", this serializes merges by deploy
# health: merging moves `main`, every other open PR must update its branch, and its
# gate then re-runs against the new (deploying) `main` and waits until it is green.
#
# How it knows main is deployed: Flux's notification-controller posts a GitHub commit
# status per Kustomization for each reconciled revision (kustomization/flux-system,
# .../infrastructure, .../apps, ...). GitHub rolls those into a single combined status
# (success / pending / failure). So this gate just polls main's combined status — no
# cluster access and no self-hosted runner required. Runs on GitHub-hosted runners.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  statuses: read

jobs:
  # Job name MUST equal the required-status-check context in the branch ruleset.
  deploy-health-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TIMEOUT_SECONDS: "1200" # 20m; job timeout (25m) is the hard backstop
    steps:
      - name: Wait for current main to be deployed (Flux commit status green)
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))

          head="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          echo "Gating on main HEAD $head — it must be fully reconciled by Flux."

          while true; do
            status="$(gh api "repos/$REPO/commits/$head/status")"
            state="$(echo "$status" | jq -r '.state')"
            # notification-controller formats Kustomization status contexts as
            # `kustomization/<name>/<digest>` (verified live: e.g.
            # `kustomization/apps/df50960c` — name is the MIDDLE segment, not the last).
            # apps is the last Kustomization in the dependsOn chain, so its success means
            # the whole infra→apps reconciliation finished for this revision (guards
            # against a false green when only some statuses have reported yet).
            apps="$(echo "$status" | jq -r '
              [.statuses[] | select(.context | startswith("kustomization/apps/")) | .state] | first // "missing"')"

            # A failed/errored Flux status means main's deploy is broken — refuse to
            # stack another merge on top of it (fix main first; admins can bypass).
            # Scope to kustomization/ contexts: those track the git revision. (HelmReleases
            # reconcile chart versions, not commits, so they post no commit status here —
            # but scoping keeps a transient non-Kustomization failure from tripping the gate.)
            if echo "$status" | jq -e '.statuses[] | select(.context | startswith("kustomization/")) | select(.state=="failure" or .state=="error")' >/dev/null; then
              echo "::error::main ($head) has a failing Flux deploy status — not safe to merge onto."
              echo "$status" | jq -r '.statuses[] | "  \(.context) = \(.state)"'
              exit 1
            fi

            if [ "$state" = "success" ] && [ "$apps" = "success" ]; then
              echo "main ($head) is fully reconciled and healthy. Gate passed."
              echo "$status" | jq -r '.statuses[] | "  \(.context) = \(.state)"'
              exit 0
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for main ($head) to finish deploying (combined=$state, apps=$apps)."
              echo "$status" | jq -r '.statuses[] | "  \(.context) = \(.state)"'
              exit 1
            fi

            echo "  combined=$state apps=$apps — waiting for Flux..."
            sleep 20
          done
