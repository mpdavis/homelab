name: Deploy Health Gate

# Blocks a PR from merging until the CURRENT `main` (i.e. the previously merged PR)
# has been reconciled by Flux and is healthy. Combined with the branch ruleset's
# "require branches up to date before merging", this serializes merges by deploy
# health: merging moves `main`, every other open PR must update its branch, and its
# gate then re-runs against the new (deploying) `main` and waits until it is green.
#
# How it knows main is deployed: Flux's notification-controller posts a GitHub commit
# status per Kustomization for each reconciled revision (kustomization/flux-system,
# .../infrastructure, .../apps, ...). GitHub rolls those into a single combined status
# (success / pending / failure). So this gate just polls main's combined status — no
# cluster access and no self-hosted runner required. Runs on GitHub-hosted runners.
#
# On top of the Flux statuses, deploy-canary.yml posts a `canary/gatus` status per
# main commit once the deployed services have been verified to actually serve
# traffic (via the Gatus synthetic-monitoring API). When that workflow exists on
# main, this gate also requires its status — Flux applying manifests is necessary
# but not sufficient.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  statuses: read

jobs:
  # Informational only — always green, never blocks. Surfaces the cluster's
  # CURRENT synthetic health on every PR so the author knows what is already
  # red before merging. The deploy canary uses the same per-endpoint check and
  # only blames a merge for pass→fail transitions, so anything listed here
  # will NOT fail that PR's canary or trigger an auto-revert.
  gatus-health-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report current Gatus endpoint health
        run: |
          set -euo pipefail
          if ! body="$(curl -fsS --max-time 20 "https://status.mpdavis.com/api/v1/endpoints/statuses?page=1&pageSize=20")"; then
            echo "::warning::Gatus API unreachable — no current-health report available (synthetic monitoring may be down)."
            exit 0
          fi
          total="$(echo "$body" | jq length)"
          failing="$(echo "$body" | jq -r '
            .[] | . as $e | ($e.results | last) as $r
            | select($r == null or ($r.success | not))
            | "\($e.group)/\($e.name)"')"
          if [ -z "$failing" ]; then
            echo "All $total Gatus endpoints currently healthy." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            count="$(echo "$failing" | wc -l | tr -d ' ')"
            echo "::warning::$count of $total Gatus endpoints already failing (pre-existing — exempt from this PR's deploy canary): $(echo "$failing" | paste -sd, -)"
            {
              echo "### ⚠️ $count of $total Gatus endpoints currently failing"
              echo
              echo "These failures predate this PR. The deploy canary only auto-reverts a merge for endpoints that go from passing to failing, so these are exempt — but somebody should still fix them:"
              echo
              echo "$failing" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Job name MUST equal the required-status-check context in the branch ruleset.
  deploy-health-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TIMEOUT_SECONDS: "1800" # 30m (Flux reconcile + canary); job timeout (35m) is the hard backstop
    steps:
      - name: Wait for current main to be deployed (Flux commit status green)
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))

          head="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          echo "Gating on main HEAD $head — it must be fully reconciled by Flux."

          # Only require the canary verdict if the canary workflow exists in
          # main HEAD's tree — keeps the gate self-consistent for commits that
          # predate the canary (its own bootstrap PR) or postdate its removal.
          canary_required=false
          if gh api "repos/$REPO/contents/.github/workflows/deploy-canary.yml?ref=$head" >/dev/null 2>&1; then
            canary_required=true
          fi
          echo "Canary required: $canary_required"

          while true; do
            status="$(gh api "repos/$REPO/commits/$head/status")"
            state="$(echo "$status" | jq -r '.state')"
            # notification-controller formats Kustomization status contexts as
            # `kustomization/<name>/<digest>` (verified live: e.g.
            # `kustomization/apps/df50960c` — name is the MIDDLE segment, not the last).
            # apps is the last Kustomization in the dependsOn chain, so its success means
            # the whole infra→apps reconciliation finished for this revision (guards
            # against a false green when only some statuses have reported yet).
            apps="$(echo "$status" | jq -r '
              [.statuses[] | select(.context | startswith("kustomization/apps/")) | .state] | first // "missing"')"
            canary="$(echo "$status" | jq -r '
              [.statuses[] | select(.context == "canary/gatus") | .state] | first // "missing"')"

            # A failed/errored Flux status means main's deploy is broken — refuse to
            # stack another merge on top of it (fix main first; admins can bypass).
            # Scope to kustomization/ contexts: those track the git revision. (HelmReleases
            # reconcile chart versions, not commits, so they post no commit status here —
            # but scoping keeps a transient non-Kustomization failure from tripping the gate.)
            if echo "$status" | jq -e '.statuses[] | select(.context | startswith("kustomization/")) | select(.state=="failure" or .state=="error")' >/dev/null; then
              echo "::error::main ($head) has a failing Flux deploy status — not safe to merge onto."
              echo "$status" | jq -r '.statuses[] | "  \(.context) = \(.state)"'
              exit 1
            fi

            # A red canary means main deployed but its services don't respond.
            # Without this branch the gate would just time out 30m later with a
            # confusing message. (error = canary superseded; only ever posted on
            # non-HEAD commits, but treat it as failing if we do see it.)
            if [ "$canary" = "failure" ] || [ "$canary" = "error" ]; then
              echo "::error::main ($head) failed its deploy canary — merge the auto-opened revert PR (or fix forward) first."
              echo "$status" | jq -r '.statuses[] | "  \(.context) = \(.state)"'
              exit 1
            fi

            # Combined success already implies every posted context is green; the
            # explicit canary check only guards the race where Flux has reported
            # green but the canary workflow hasn't posted its pending status yet.
            if [ "$state" = "success" ] && [ "$apps" = "success" ] && { [ "$canary_required" = "false" ] || [ "$canary" = "success" ]; }; then
              echo "main ($head) is fully reconciled, healthy, and canary-verified. Gate passed."
              echo "$status" | jq -r '.statuses[] | "  \(.context) = \(.state)"'
              exit 0
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for main ($head) to finish deploying (combined=$state, apps=$apps, canary=$canary)."
              echo "$status" | jq -r '.statuses[] | "  \(.context) = \(.state)"'
              exit 1
            fi

            echo "  combined=$state apps=$apps canary=$canary — waiting..."
            sleep 20
          done
