name: Build Ames Council Digest Image

# Builds docker/ames-council-digest into ghcr.io/mpdavis/ames-council-digest.
# Tags are semver (1.0.<run_number>) so the CronJob pins a real tag
# (image-pin-check) and Renovate's kubernetes manager can open bump PRs — the
# image is never referenced as :latest.
#
# Also builds+pushes on same-repo pull requests touching the image, so the
# manifests PR that references the new tag can pass image-pin-check before the
# image PR merges.

on:
  push:
    branches: [main]
    paths:
      - 'docker/ames-council-digest/**'
  pull_request:
    paths:
      - 'docker/ames-council-digest/**'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-ames-council-digest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: docker/ames-council-digest
          platforms: linux/amd64
          # Fork PRs have a read-only token; build without pushing there.
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: |
            ghcr.io/mpdavis/ames-council-digest:1.0.${{ github.run_number }}
            ghcr.io/mpdavis/ames-council-digest:latest

      - name: Print image tag
        run: echo "Published ghcr.io/mpdavis/ames-council-digest:1.0.${{ github.run_number }}"
