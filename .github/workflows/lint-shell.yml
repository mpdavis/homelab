name: Lint · Shell

# shellcheck over tracked *.sh files (docker/coding-agent/entrypoint.sh,
# .github/scripts/*.sh). Advisory: NOT on main's ruleset, paths-filtered, and on a
# PR it lints only the scripts that PR changed.
#
# Scripts embedded in workflow `run:` blocks are out of scope — that is actionlint's
# job, and this repo does not run it yet.

on:
  pull_request:
    paths:
      - '**/*.sh'
      - '.shellcheckrc'
      - '.github/workflows/lint-shell.yml'
  # No `push: main` trigger — see lint-dockerfile.yml. PR-time diff check;
  # `workflow_dispatch` runs the whole tree.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lint-shell-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=koalaman/shellcheck
  SHELLCHECK_VERSION: "v0.10.0"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install shellcheck
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP" "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          mv "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$RUNNER_TEMP/bin/shellcheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Select shell scripts in scope
        id: select
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --diff-filter=d \
              "${{ github.event.pull_request.base.sha }}" HEAD \
              | { grep -E '\.sh$' || true; } > files.txt
          else
            git ls-files '*.sh' > files.txt
          fi
          count=$(wc -l < files.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "No shell scripts in scope; nothing to lint."
          else
            echo "Linting:"; cat files.txt
          fi

      - name: Run shellcheck
        if: steps.select.outputs.count != '0'
        run: |
          # .shellcheckrc in the repo root is picked up automatically.
          xargs -a files.txt shellcheck --color=always
