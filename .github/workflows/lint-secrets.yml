name: Lint · Secrets

# gitleaks. No `paths` filter — a leaked credential can land in any file — but this
# is still advisory (NOT on main's ruleset). On a PR it scans only the commit range
# the PR adds; on push to `main` it scans the pushed range; `workflow_dispatch`
# scans full history.
#
# Allowlist and rule extensions live in .gitleaks.toml. This repo keeps secret data
# out of git by design (External Secrets + Bitwarden, see CLAUDE.md); this is the
# backstop for a mistake that bypasses that.

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lint-secrets-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  GITLEAKS_VERSION: "v8.30.1"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ver="${GITLEAKS_VERSION#v}"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${ver}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Determine scan range
        id: range
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              echo "opts=--log-opts=${{ github.event.pull_request.base.sha }}..HEAD" >> "$GITHUB_OUTPUT"
              ;;
            push)
              before="${{ github.event.before }}"
              if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
                echo "opts=" >> "$GITHUB_OUTPUT"
              else
                echo "opts=--log-opts=${before}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "opts=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run gitleaks
        run: |
          # `detect --source` works across the whole v8 line; the newer `git`
          # subcommand is not in v8.18.
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --no-banner \
            ${{ steps.range.outputs.opts }}
