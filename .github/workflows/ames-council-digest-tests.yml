name: Ames Council Digest Tests

# The unit suite for docker/ames-council-digest, run as its own workflow so it
# can be a required check on main.
#
# NO `paths` FILTER, DELIBERATELY. A required check has to report on every pull
# request: one that is skipped never reports at all, and GitHub waits for it
# forever rather than treating it as passed. That is the same lesson as
# image-pin-check (#425) — a required check and a paths filter cannot coexist.
# The cost of running it unconditionally is a few seconds on PRs that do not
# touch the digest, which is cheaper than the alternative of it being advisory.
#
# It lives here rather than in build-ames-council-digest.yml because that
# workflow keeps its paths filter for a good reason: it publishes an image tag
# on every main push that matches, and running it unfiltered would push a new
# tag for merges whose image contents are identical to the last one.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ames-council-digest-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # The version the image ships, so the suite runs on what actually runs.
      - name: Install the package and its test dependencies
        working-directory: docker/ames-council-digest
        run: pip install -e ".[dev]"

      - name: Run unit tests
        working-directory: docker/ames-council-digest
        run: pytest -q
