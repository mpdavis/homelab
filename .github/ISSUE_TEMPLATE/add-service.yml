name: Add a new service
description: Request a new application/service be deployed to the homelab k3s cluster
title: "Add service: <service-name>"
labels: ["add-service"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to request a new service for the cluster. The fields mirror the
        `add-service` skill's requirements — fill in what you know and leave anything
        you're unsure about blank or as a question. Defaults: services are deployed as a
        **HelmRelease** (official chart, else the bjw-s `app-template`), images are
        **pinned** (never `latest`/`edge`), and ingress is terminated at Traefik with a
        Homepage tile.

  - type: input
    id: service-name
    attributes:
      label: Service name
      description: lowercase, kebab-case (e.g. `bazarr`, `tautulli`)
      placeholder: my-service
    validations:
      required: true

  - type: dropdown
    id: namespace
    attributes:
      label: Namespace
      description: Group related services together. Choose an existing namespace or request a new one.
      options:
        - media (arr apps, players, download clients, request managers)
        - ai (inference / model serving)
        - New namespace (describe in "Additional context")
      default: 0
    validations:
      required: true

  - type: dropdown
    id: deployment-type
    attributes:
      label: Deployment type
      description: Default is a HelmRelease. Plain Kustomize is a fallback only.
      options:
        - HelmRelease — bjw-s app-template (default)
        - HelmRelease — official/community chart
        - Plain Kustomize manifests (only if neither chart fits)
      default: 0
    validations:
      required: true

  - type: input
    id: chart
    attributes:
      label: Chart (official-chart deployments only)
      description: Chart name + repo URL (prefer `oci://`). Leave blank for app-template / Kustomize.
      placeholder: "ollama — oci://ghcr.io/otwld/ollama-helm"
    validations:
      required: false

  - type: input
    id: image
    attributes:
      label: Container image (pinned)
      description: Full image reference pinned to a tag or digest. No `latest`/`edge` — the image-pin-check workflow will fail the PR.
      placeholder: ghcr.io/recyclarr/recyclarr:7.4.1
    validations:
      required: true

  - type: input
    id: port
    attributes:
      label: Primary HTTP port
      description: The container's primary HTTP port. Leave blank if the service has no web port.
      placeholder: "8080"
    validations:
      required: false

  - type: dropdown
    id: ingress
    attributes:
      label: Needs ingress (web UI)?
      description: Exposes a web UI at `<service-name>.mpdavis.com` via Traefik. A web UI also requires a Homepage tile (below).
      options:
        - "Yes — exposed at <service-name>.mpdavis.com"
        - "No — no web UI / internal only"
      default: 0
    validations:
      required: true

  - type: input
    id: homepage
    attributes:
      label: Homepage tile (required if it has ingress)
      description: Section (Media, IPTV, AI, Infrastructure, …) and a one-line description for the dashboard tile.
      placeholder: "Media — Subtitle management for the library"
    validations:
      required: false

  - type: dropdown
    id: storage
    attributes:
      label: Persistent storage
      description: What the service needs to persist. Choose all that apply in "Additional context" if more than one.
      multiple: true
      options:
        - Config/database — local-path, ReadWriteOnce
        - Media — nfs-data / inline NFS, ReadWriteMany
        - Appdata bulk — nfs-homelab, ReadWriteMany
        - None — stateless
    validations:
      required: true

  - type: input
    id: storage-size
    attributes:
      label: Config storage size
      description: Requested size for the config/DB PVC (typical 2–5Gi). Leave blank for the default.
      placeholder: 2Gi
    validations:
      required: false

  - type: textarea
    id: secrets
    attributes:
      label: Secrets (Bitwarden Secrets Manager)
      description: List each secret as `key-name → Bitwarden UUID`. Synced via ExternalSecret — never paste secret values here.
      placeholder: |
        api-key → 00000000-0000-0000-0000-000000000000
    validations:
      required: false

  - type: checkboxes
    id: special
    attributes:
      label: Special requirements
      description: Check anything that applies and explain in "Additional context".
      options:
        - label: GPU (nvidia.com/gpu + runtimeClassName nvidia)
        - label: Node selection (nodeSelector)
        - label: Sidecar container(s)
        - label: Extra environment variables / ConfigMap
        - label: Scheduled job (cronjob)

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: New-namespace details, links to docs/charts, multiple storage volumes, env vars, or anything else relevant.
    validations:
      required: false
