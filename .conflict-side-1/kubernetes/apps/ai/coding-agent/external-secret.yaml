apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coding-agent-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: coding-agent-secrets
  data:
    # Long-lived Claude subscription OAuth token from `claude setup-token`
    # (~1 year expiry — re-mint and update the BWS value to rotate).
    - secretKey: claude-code-oauth-token
      remoteRef:
        key: ${BWS_CODING_AGENT_CLAUDE_OAUTH_TOKEN}
    # Fine-grained GitHub PAT scoped to mpdavis/homelab: Contents RW +
    # Pull requests RW. Lets the agent push branches and open PRs — main is
    # protected, so it cannot merge or push to main.
    - secretKey: github-token
      remoteRef:
        key: ${BWS_CODING_AGENT_GITHUB_TOKEN}
