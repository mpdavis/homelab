apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiobookshelf
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "~5.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    crds: CreateReplace
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/advplyr/audiobookshelf
              tag: 2.36.0
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            env:
              TZ: ${TZ}
              PORT: "3000"
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
    persistence:
      config:
        existingClaim: audiobookshelf
        globalMounts:
          - path: /config
      metadata:
        existingClaim: audiobookshelf-metadata
        globalMounts:
          - path: /metadata
      # The shared media NFS export. Point AudiobookShelf's libraries at
      # /media/audiobooks and /media/podcasts in the web UI (matches where
      # the *arr apps / download clients read & write).
      media:
        type: nfs
        server: ${NAS_IP}
        path: ${NAS_DATA_PATH}/media
        globalMounts:
          - path: /media
