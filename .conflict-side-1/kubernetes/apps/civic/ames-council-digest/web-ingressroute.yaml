# The underlying documents and these summaries are public records. Keep this
# route open; subscribe is intentionally an inert mail link, not a write API.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ames-council-digest-web
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`council.${DOMAIN}`)
      kind: Rule
      services:
        - name: ames-council-digest-web
          port: 80
  tls: {}
